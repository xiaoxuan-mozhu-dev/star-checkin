<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050a18; color: #fff; font-family: -apple-system, 'PingFang SC', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }

/* Title */
.showcase-title {
  font-size: 48px; font-weight: 900; letter-spacing: 5px;
  margin-bottom: 6px; text-align: center;
  background: linear-gradient(135deg, #ffd700, #ff6b35, #ffd700);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.showcase-subtitle {
  font-size: 15px; opacity: 0.5; letter-spacing: 3px;
  margin-bottom: 6px; text-align: center; font-weight: 300; color: #c0c8e0;
}
.showcase-desc {
  font-size: 13px; opacity: 0.35; letter-spacing: 1px;
  margin-bottom: 28px; text-align: center; color: #a0a8c0;
}

/* Counter */
.counter-row { display: flex; gap: 24px; margin-bottom: 30px; }
.showcase-counter-item {
  background: rgba(255,215,0,0.04);
  border: 1px solid rgba(255,215,0,0.15);
  border-radius: 12px; padding: 12px 28px; text-align: center;
}
.showcase-counter-num { font-size: 32px; font-weight: 900; color: #ffd700; }
.showcase-counter-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

/* Grid */
.showcase-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 18px; max-width: 1400px; width: 100%; padding: 4px;
}
.showcase-card {
  background: linear-gradient(145deg, rgba(255,215,0,0.06) 0%, rgba(100,80,160,0.04) 100%);
  border: 1px solid rgba(255,215,0,0.2);
  border-radius: 14px; overflow: hidden; cursor: pointer;
  transition: all 0.35s ease;
  display: flex; flex-direction: column;
}
.showcase-card:hover {
  background: linear-gradient(145deg, rgba(255,215,0,0.15) 0%, rgba(100,80,160,0.08) 100%);
  border-color: rgba(255,215,0,0.6);
  transform: translateY(-4px);
}
.showcase-card-img {
  width: 100%; aspect-ratio: 16/10; object-fit: cover;
  border-bottom: 1px solid rgba(255,215,0,0.2);
  background: rgba(0,0,0,0.4);
}
.showcase-card-body { padding: 8px 10px; text-align: center; }
.showcase-card-name {
  font-size: 15px; font-weight: 700; margin-bottom: 2px;
  color: rgba(255,255,255,0.95);
}
.showcase-card-badge {
  position: absolute; top: 8px; right: 8px;
  background: rgba(255,215,0,0.85); color: #1a0f2e; font-size: 10px;
  padding: 3px 10px; border-radius: 10px; font-weight: 700; letter-spacing: 0.5px;
}

/* Mobile */
@media (max-width: 768px) {
  .showcase-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
}
</style>
</head>
<body>

<h1 class="showcase-title">星河毕业展</h1>
<p class="showcase-subtitle">秋叶1班 · 1期AI编程训练营</p>
<p class="showcase-desc">星河滚烫，不如编程 ✨ 18位同学已通关，作品如下</p>

<div class="counter-row">
  <div class="showcase-counter-item"><div class="showcase-counter-num">15</div><div class="showcase-counter-label">已通关</div></div>
  <div class="showcase-counter-item"><div class="showcase-counter-num">33</div><div class="showcase-counter-label">总人数</div></div>
</div>

<div class="showcase-grid" id="grid"></div>

<script>
const SHOWCASE = [
  { name: '阿山', img: 'scroll_assets/ashan_work.png' },
  { name: '李飞', img: 'scroll_assets/lifei_work.png' },
  { name: '王剑', img: 'scroll_assets/wangjian_work.png' },
  { name: '吴同学', img: 'scroll_assets/wu_work.png' },
  { name: 'Vicky', img: 'scroll_assets/vicky_work.png' },
  { name: '清风', img: 'scroll_assets/qingfeng_work.png' },
  { name: '胖虎', img: 'scroll_assets/panghu_work.jpg' },
  { name: '忘忧君', img: 'scroll_assets/wangyoujun_work.jpg' },
  { name: '绵', img: 'scroll_assets/mian_work.jpg' },
  { name: '方大锤', img: 'scroll_assets/fangdachui_work.jpg' },
  { name: '新心', img: 'scroll_assets/xinxin_work.jpg' },
  { name: '老崔', img: 'scroll_assets/laoCui_work.jpg' },
  { name: '天线', img: 'scroll_assets/tianxian_work.jpg' },
  { name: '凌飞', img: 'scroll_assets/lingfei_work.jpg' },
  { name: '石八方', img: 'scroll_assets/shibafang_work.jpg' },
  { name: '山风中', img: 'scroll_assets/shanfengzhong_work.jpg' },
  { name: '晓语', img: 'scroll_assets/xiaoyu_work.png' },
  { name: '威尔伯', img: 'scroll_assets/wilbur_work.png', link: 'https://96855e965293409f93a5f3c52ca301af.app.codebuddy.work' },
  { name: '彬彬', img: 'scroll_assets/binbin_work.png' }
];

const grid = document.getElementById('grid');
SHOWCASE.forEach(s => {
  const card = document.createElement('div');
  card.className = 'showcase-card';
  card.style.position = 'relative';
  card.innerHTML = '<img class="showcase-card-img" src="' + s.img + '" alt="' + s.name + '">' +
    '<div class="showcase-card-body"><div class="showcase-card-name">' + s.name + '</div></div>' +
    '<div class="showcase-card-badge">✓ 已通关</div>';
  card.onclick = () => window.open(s.link || s.img, '_blank');
  grid.appendChild(card);
});
</script>
</body>
</html>
