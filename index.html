<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>星河打卡 · AI编程训练营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#080418}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(5,5,20,0.4) 100%)}
.scene{position:relative;z-index:2;width:100%;width:100%;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:16px 4px 10px}
.header{text-align:center;flex-shrink:0}
.header h1{font-size:20px;font-weight:800;color:#fff;letter-spacing:4px;text-shadow:0 0 20px rgba(100,140,255,0.25)}
.header .sub{font-size:11px;color:rgba(160,180,255,0.4);margin-top:2px;letter-spacing:4px}
.heart-area{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.heart-grid{position:relative;margin:0 auto}
.heart-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;height:90vw;max-width:400px;max-height:400px;background:radial-gradient(ellipse,rgba(80,50,180,0.08) 0%,transparent 70%);pointer-events:none;z-index:-1}
.robot-section{flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-top:-8px}
.robot-img{width:85px;height:auto;object-fit:contain;filter:drop-shadow(0 0 8px rgba(80,150,255,0.25))}
.robot-label{font-size:8px;color:rgba(140,180,255,0.35);letter-spacing:3px;margin-top:2px}
.bottom-stats{flex-shrink:0;text-align:center;margin-top:6px}
.progress-label{font-size:10px;color:rgba(255,255,255,0.25);margin-bottom:1px}
.progress-num{font-size:26px;font-weight:800;color:#fff;text-shadow:0 0 10px rgba(255,200,80,0.2)}
.progress-num span{font-size:12px;color:rgba(255,255,255,0.15);font-weight:400}
.progress-bar{width:130px;height:2px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;margin:4px auto 0}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#ffd700,#ff9900,#ff6600);transition:width 0.6s}
.progress-tip{font-size:7px;color:rgba(255,255,255,0.06);margin-top:3px;letter-spacing:2px}
.hex{position:absolute;cursor:pointer;transition:transform 0.2s,filter 0.2s}
.hex.available:hover{transform:scale(1.1);filter:brightness(1.4) drop-shadow(0 0 8px rgba(100,180,255,0.5));z-index:10}
.hex.lit{cursor:default}
.hex.star{animation:starPulse 2s ease-in-out infinite}.hex.taken{cursor:not-allowed;opacity:0.5}
.hex svg{display:block}
@keyframes hexPop{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.hex.just-lit{animation:hexPop 0.5s ease-out forwards}
@keyframes breathe{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.06) drop-shadow(0 0 4px rgba(255,200,80,0.15))}}
.hex.lit{animation:breathe 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.15) drop-shadow(0 0 6px rgba(80,140,255,0.2))}}
@keyframes starPulse{0%,100%{filter:brightness(1.2) drop-shadow(0 0 8px rgba(255,215,0,0.6))}50%{filter:brightness(1.6) drop-shadow(0 0 16px rgba(255,215,0,0.9))}}
.hex.available{animation:pulse 2.5s ease-in-out infinite}
/* 粒子层 */
.particle{position:absolute;pointer-events:none;border-radius:50%;z-index:20}
/* 庆祝层 */
.celebration{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(5,5,20,0.7);backdrop-filter:blur(4px)}
.celebration.show{display:flex}
.celebration-card{background:linear-gradient(135deg,rgba(25,20,60,0.96),rgba(12,12,45,0.98));border:1px solid rgba(255,200,80,0.2);border-radius:20px;padding:32px 28px;text-align:center;animation:celebPop 0.6s ease-out}
@keyframes celebPop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.celebration-card .icon{font-size:48px;margin-bottom:8px}
.celebration-card .title{font-size:20px;color:#ffd700;font-weight:800;margin-bottom:4px}
.celebration-card .desc{font-size:12px;color:rgba(160,180,255,0.5);margin-bottom:16px}
.celebration-card .close-btn{padding:10px 32px;background:linear-gradient(135deg,#ffd700,#ff9900);border:none;border-radius:12px;color:#1a1000;font-size:14px;font-weight:700;cursor:pointer}
.modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(15,10,40,0.88);backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex}
.modal-card{background:linear-gradient(135deg,rgba(25,20,60,0.96),rgba(12,12,45,0.98));border:1px solid rgba(255,200,80,0.12);border-radius:16px;padding:24px 22px;text-align:center;width:270px;animation:modalIn 0.3s ease-out}
@keyframes modalIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-card .label{font-size:14px;color:rgba(160,180,255,0.7);margin-bottom:12px}
.modal-card input{width:100%;padding:12px;background:rgba(8,8,35,0.8);border:1px solid rgba(255,200,80,0.12);border-radius:10px;color:#ffd700;font-size:15px;text-align:center;outline:none;font-weight:600}
.modal-card input::placeholder{color:rgba(255,255,255,0.1);font-size:13px}
.modal-card input:focus{border-color:rgba(255,200,80,0.35)}
.modal-card .btns{display:flex;gap:10px;margin-top:12px}
.modal-card .btn-cancel{flex:1;padding:10px 0;background:transparent;border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:rgba(255,255,255,0.2);font-size:13px;cursor:pointer}
.modal-card .btn-ok{flex:1;padding:10px 0;background:linear-gradient(135deg,#ffd700,#ff9900);border:none;border-radius:10px;color:#1a1000;font-size:13px;font-weight:700;cursor:pointer}
.modal-card .error{color:#ff5555;font-size:11px;margin-top:6px;display:none}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(15,10,40,0.96);border:1px solid rgba(255,200,80,0.15);border-radius:18px;padding:28px 36px;text-align:center;z-index:200;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .icon{font-size:40px;margin-bottom:6px}
.toast .msg{font-size:16px;color:#ffd700;font-weight:700}
.toast .sub{font-size:11px;color:rgba(160,180,255,0.4);margin-top:4px}
.already-toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(15,10,40,0.92);border:1px solid rgba(100,140,255,0.08);border-radius:12px;padding:14px 22px;text-align:center;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none}
.already-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.already-toast .msg{font-size:12px;color:rgba(160,180,255,0.5)}
.admin-fab{position:fixed;bottom:12px;right:12px;z-index:50;width:26px;height:26px;border-radius:50%;background:rgba(15,10,40,0.5);border:1px solid rgba(100,140,255,0.06);color:rgba(100,140,255,0.25);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.admin-panel{position:fixed;bottom:44px;right:12px;z-index:50;display:none;gap:6px;align-items:center;background:rgba(15,10,40,0.92);border:1px solid rgba(100,140,255,0.06);border-radius:8px;padding:8px 12px}
.admin-panel.show{display:flex}
.admin-panel label{font-size:9px;color:rgba(160,180,255,0.3)}
.admin-panel input{background:rgba(8,8,35,0.8);border:1px solid rgba(100,140,255,0.08);color:#ccc;padding:3px 6px;border-radius:4px;font-size:9px;width:40px;text-align:center}
.admin-panel button{background:rgba(0,60,140,0.3);border:1px solid rgba(100,140,255,0.08);color:rgba(160,180,255,0.4);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:9px}
.admin-panel button.primary{background:linear-gradient(135deg,#0055aa,#0077cc);color:#fff;border:none}

.share-btn{position:absolute;top:4px;right:6px;z-index:999;padding:3px 8px;border-radius:10px;background:rgba(255,200,80,0.15);color:rgba(255,220,120,0.7);font-size:10px;font-weight:600;border:1px solid rgba(255,200,80,0.25);cursor:pointer;white-space:nowrap}
.share-btn:active{opacity:0.7}

</style>

function findScale(){
  var lo=20,hi=300;
  for(var i=0;i<100;i++){var mid=(lo+hi)/2,cnt=countInside(mid);if(cnt<total)lo=mid;else hi=mid}
  return hi;
}
function countInside(s){
  var n=0;
  for(var row=-10;row<=10;row++)for(var col=-10;col<=10;col++){
    var px=col*stepX+(Math.abs(row)%2===1?halfStep:0),py=row*stepY;
    if(heartVal(px/s,-py/s)<=0)n++;
  }
  return n;
}
function getCells(s){
  var cells=[];
  for(var row=-10;row<=10;row++)for(var col=-10;col<=10;col++){
    var px=col*stepX+(Math.abs(row)%2===1?halfStep:0),py=row*stepY;
    var v=heartVal(px/s,-py/s);
    if(v<=0)cells.push({row:row,col:col,px:px,py:py,v:v});
  }
  return cells;
}

/* 3D宝石六边形SVG - 尖顶 */
function hexSVG(lit,disp,idx){
  var w=Math.round(sqrt3*R), h=2*R;
  var cx=w/2, cy=h/2;
  /* 外框 */
  var pts=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts.push((cx+R*Math.cos(angle)).toFixed(1)+','+(cy+R*Math.sin(angle)).toFixed(1))}
  var ps=pts.join(' ');
  /* 第一层内缩 */
  var R1=R*0.82, pts1=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts1.push((cx+R1*Math.cos(angle)).toFixed(1)+','+(cy+R1*Math.sin(angle)).toFixed(1))}
  var ps1=pts1.join(' ');
  /* 第二层内缩 */
  var R2=R*0.6, pts2=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts2.push((cx+R2*Math.cos(angle)).toFixed(1)+','+(cy+R2*Math.sin(angle)).toFixed(1))}
  var ps2=pts2.join(' ');
  /* 第三层 - 宝石台面 */
  var R3=R*0.35, pts3=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts3.push((cx+R3*Math.cos(angle)).toFixed(1)+','+(cy+R3*Math.sin(angle)).toFixed(1))}
  var ps3=pts3.join(' ');

  if(lit){
    /* 点亮态 - 金色宝石 + 昵称 */
    var nameSize = Math.max(9, R*0.42);
    var nameY = disp ? cy + nameSize*0.35 : cy;
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="gl'+idx+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6a4a10"/><stop offset="50%" stop-color="#3a2510"/><stop offset="100%" stop-color="#2a1a08"/></linearGradient>'+
        '<radialGradient id="gr'+idx+'" cx="50%" cy="35%" r="50%"><stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/><stop offset="100%" stop-color="#ffd700" stop-opacity="0"/></radialGradient>'+
      '</defs>'+
      /* 外发光 */
      '<polygon points="'+ps+'" fill="none" stroke="rgba(255,200,80,0.15)" stroke-width="6" style="filter:blur(4px)"/>'+
      /* 外框 */
      '<polygon points="'+ps+'" fill="url(#gl'+idx+')" stroke="#ffcc44" stroke-width="1.2"/>'+
      /* 切面1 */
      '<polygon points="'+ps1+'" fill="#4a3015" stroke="#8a6a20" stroke-width="0.3"/>'+
      /* 切面2 */
      '<polygon points="'+ps2+'" fill="#6a4a18" />'+
      /* 台面 */
      '<polygon points="'+ps3+'" fill="#8a6a20"/>'+
      /* 内部高光 */
      '<polygon points="'+ps3+'" fill="url(#gr'+idx+')"/>'+
      /* 顶部光点 */
      '<circle cx="'+cx+'" cy="'+Math.round(cy*0.3)+'" r="'+Math.round(R*0.08)+'" fill="#ffd700" opacity="0.8"/>'+
      /* 昵称 - 大字居中 */
      (disp?'<text x="'+cx+'" y="'+Math.round(nameY)+'" text-anchor="middle" font-size="'+nameSize.toFixed(1)+'" fill="#fff" font-weight="800" style="text-shadow:0 0 6px rgba(255,180,50,0.8),0 1px 2px rgba(0,0,0,0.5)">'+disp+'</text>':'')+
      '</svg>';
  }else{
    /* 未点亮 - 深蓝宝石 */
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="dl'+idx+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a3a"/><stop offset="50%" stop-color="#121230"/><stop offset="100%" stop-color="#0e0e25"/></linearGradient>'+
        '<radialGradient id="dr'+idx+'" cx="50%" cy="35%" r="50%"><stop offset="0%" stop-color="rgba(80,140,255,0.06)"/><stop offset="100%" stop-color="rgba(80,140,255,0)"/></radialGradient>'+
      '</defs>'+
      /* 外框 */
      '<polygon points="'+ps+'" fill="url(#dl'+idx+')" stroke="rgba(80,140,255,0.3)" stroke-width="0.8"/>'+
      /* 切面1 */
      '<polygon points="'+ps1+'" fill="#181838" stroke="rgba(80,140,255,0.1)" stroke-width="0.3"/>'+
      /* 切面2 */
      '<polygon points="'+ps2+'" fill="#1e1e42" />'+
      /* 台面 */
      '<polygon points="'+ps3+'" fill="#222250"/>'+
      /* 微弱内光 */
      '<polygon points="'+ps3+'" fill="url(#dr'+idx+')"/>'+
      /* 中心微光点 */
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+Math.round(R*0.06)+'" fill="rgba(80,140,255,0.12)"/>'+
      '</svg>';
  }
}

function cuteName(n){if(!n)return'';if(/^[a-zA-Z]/.test(n))return n;if(n.length<=2)return n;if(n.length>=2&&n.charAt(n.length-1)===n.charAt(n.length-2))return n.slice(-2);return n.charAt(n.length-1)+n.charAt(n.length-1)}

/* 粒子爆发 */
function burstParticles(el){
  var rect=el.getBoundingClientRect();
  var ox=rect.left+rect.width/2, oy=rect.top+rect.height/2;
  var colors=['#ffd700','#ff9900','#ffcc44','#ffee88','#ffffff'];
  for(var i=0;i<12;i++){
    var p=document.createElement('div');p.className='particle';
    var angle=Math.PI*2*i/12, dist=30+Math.random()*25;
    var dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist;
    var size=2+Math.random()*3;
    p.style.cssText='left:'+ox+'px;top:'+oy+'px;width:'+size+'px;height:'+size+'px;background:'+colors[i%colors.length]+';position:fixed;transition:all 0.6s cubic-bezier(0.25,0.46,0.45,0.94);opacity:1;';
    document.body.appendChild(p);
    (function(el,dx,dy){requestAnimationFrame(function(){el.style.transform='translate('+dx+'px,'+dy+'px)';el.style.opacity='0'})})(p,dx,dy);
    (function(el){setTimeout(function(){el.remove()},700)})(p);
  }
}

function buildGrid(){
  total=parseInt(document.getElementById('totalInput').value)||33;
  total=Math.max(1,Math.min(99,total));
  var scale=findScale();
  var cells=getCells(scale);
  if(cells.length>total){cells.sort(function(a,b){return b.v-a.v});cells=cells.slice(cells.length-total)}
  cells.sort(function(a,b){return a.py!==b.py?a.py-b.py:a.px-b.px});
  total=cells.length;
  document.getElementById('totalInput').value=total;
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(var i=0;i<cells.length;i++){
    if(cells[i].px<minX)minX=cells[i].px;if(cells[i].px>maxX)maxX=cells[i].px;
    if(cells[i].py<minY)minY=cells[i].py;if(cells[i].py>maxY)maxY=cells[i].py;
  }
  var offX=-minX+10, offY=-minY+10;
  var gridW=maxX-minX+sqrt3*R+20, gridH=maxY-minY+2*R+20;
  var grid=document.getElementById('heartGrid');grid.innerHTML='';
  grid.style.width=gridW+'px';grid.style.height=gridH+'px';
  var glow=document.createElement('div');glow.className='heart-glow';grid.appendChild(glow);
  for(var i=0;i<cells.length;i++){
    var isLit=litMap.hasOwnProperty(i), isMine=(myLitIndex===i);
    var el=document.createElement('div');
    var cls='hex';if(isLit)cls+=' lit';else cls+=' available';if(isLit&&!isMine)cls+=' taken';var litKeys=window._litOrder||[];if(isLit&&litKeys.indexOf(i)<3&&litKeys.indexOf(i)>=0)cls+=' star';
    el.className=cls;
    el.style.left=(cells[i].px+offX)+'px';el.style.top=(cells[i].py+offY)+'px';
    el.setAttribute('data-index',i);
    el.innerHTML=hexSVG(isLit,isLit?cuteName(litMap[i]):'',i);
    (function(idx){el.onclick=function(){onCellClick(idx)}})(i);
    grid.appendChild(el);
  }
  updateProgress();
}

var _clickLock=false;
function onCellClick(idx){
  if(_clickLock)return;_clickLock=true;setTimeout(function(){_clickLock=false},500);
  if(adminMode&&litMap.hasOwnProperty(idx)){
    var nm=litMap[idx];if(confirm('按灭 '+nm+' 的模块？')){adminUnlightByName(nm)}return;
  }
  if(adminMode&&!litMap.hasOwnProperty(idx)){
    var aname=prompt('代点亮 - 输入学员昵称：');
    if(aname&&aname.trim()){adminLightFor(idx,aname.trim())}return;
  }
  if(myLitIndex>=0){if(myLitIndex===idx)return;showAlready();return}
  if(litMap.hasOwnProperty(idx))return;
  pendingIdx=idx;
  document.getElementById('nameInput').value=myName||'';
  document.getElementById('nameError').style.display='none';
  document.getElementById('nameModal').classList.add('show');
  setTimeout(function(){document.getElementById('nameInput').focus()},100);
}
function confirmName(){
  var name=document.getElementById('nameInput').value.trim(),err=document.getElementById('nameError');
  if(!name){err.textContent='请输入昵称';err.style.display='block';return}
  myName=name;
  err.style.display='none';
  /* Call API to light */
  fetch('/api/light',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:pendingIdx,name:myName})})
  .then(function(r){if(!r.ok)throw new Error('网络错误');return r.json()})
  .then(function(d){
    if(d.error){
      if(d.yourIndex!==undefined){
        myLitIndex=d.yourIndex;
        localStorage.setItem('sc_myName',myName);
        document.getElementById('nameModal').classList.remove('show');
        showAlready();
        loadState();
      }else{
        err.textContent=d.error;err.style.display='block';
        if(d.error==='你已经点亮过了哦'){localStorage.removeItem('sc_myName');myName='';myLitIndex=-1;loadState()}
      }
      return;
    }
    litMap=d.cells;myLitIndex=pendingIdx;
    localStorage.setItem('sc_myName',myName);
    document.getElementById('nameModal').classList.remove('show');
    buildGrid();
    var hxs=document.querySelectorAll('.hex');
    for(var i=0;i<hxs.length;i++){
      if(parseInt(hxs[i].getAttribute('data-index'))===pendingIdx){
        hxs[i].classList.add('just-lit');burstParticles(hxs[i]);
        (function(el){setTimeout(function(){el.classList.remove('just-lit')},600)})(hxs[i]);
      }
    }
    showSuccess();
    var litCount=0;for(var k in litMap)if(litMap.hasOwnProperty(k))litCount++;
    if(litCount>=total){setTimeout(function(){showCelebration()},1500)}
  })
  .catch(function(e){err.textContent='网络错误，请重试';err.style.display='block'});
}
function cancelName(){document.getElementById('nameModal').classList.remove('show');pendingIdx=-1}
document.getElementById('nameInput').addEventListener('keyup',function(e){if(e.key==='Enter')confirmName()});

function updateProgress(){
  var n=0;for(var k in litMap)if(litMap.hasOwnProperty(k))n++;
  var pct=Math.round(n/total*100);
  document.getElementById('progressNum').innerHTML=n+'<span> / '+total+'</span>';
  document.getElementById('progressBar').style.width=pct+'%';
  var ratio=Math.min(n/total,1);
  var rv=document.getElementById('robotImg');
  if(rv)rv.style.filter='drop-shadow(0 0 '+(6+10*ratio)+'px rgba(80,150,255,'+(0.2+0.3*ratio)+'))';
  /* 心形光晕随点亮增强 */
  var gw=document.querySelector('.heart-glow');
  if(gw)gw.style.background='radial-gradient(ellipse,rgba(80,50,180,'+(0.08+0.12*ratio)+') 0%,transparent 70%)';
}

    var nm=litMap[i]||'';if(nm){var isEn=/^[a-zA-Z]/.test(nm);var disp=isEn?nm:(nm.length<=2?nm:(nm.length>=2&&nm.charAt(nm.length-1)===nm.charAt(nm.length-2)?nm.slice(-2):nm.charAt(nm.length-1)+nm.charAt(nm.length-1)));ctx.fillStyle='#fff';ctx.font='bold '+Math.max(isEn?8:11,R2*(isEn?0.28:0.4)).toFixed(0)+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(disp,cx2,cy2)}}
