<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>龙虾进阶打卡 · AI编程训练营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#141a38}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(10,14,39,0.5) 100%)}
.scene{position:relative;z-index:2;width:100%;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:16px 4px 10px}
.header{text-align:center;flex-shrink:0}
.header h1{font-size:22px;font-weight:800;color:#fff;letter-spacing:4px;text-shadow:0 0 20px rgba(255,149,0,0.3)}
.header .sub{font-size:13px;color:rgba(255,179,71,0.55);margin-top:2px;letter-spacing:4px}
.heart-area{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.heart-grid{position:relative;margin:0 auto}
.heart-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;height:90vw;max-width:400px;max-height:400px;background:radial-gradient(ellipse,rgba(255,149,0,0.08) 0%,transparent 70%);pointer-events:none;z-index:-1}
.robot-section{flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-top:10px}
.robot-img-wrap{position:relative;width:180px;height:180px;border-radius:12px;overflow:hidden;filter:drop-shadow(0 0 20px rgba(255,149,0,0.6));-webkit-touch-callout:default;-webkit-user-select:none;user-select:none}.robot-img{width:100%;height:100%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}.robot-guard{position:absolute;inset:0;border-radius:12px;z-index:-1;pointer-events:none}
.robot-label{font-size:9px;color:rgba(255,179,71,0.45);letter-spacing:3px;margin-top:2px}
.bottom-stats{flex-shrink:0;text-align:center;margin-top:2px}
.progress-label{font-size:9px;color:rgba(255,255,255,0.25);margin-bottom:1px;margin-top:4px}
.progress-num{font-size:22px;font-weight:800;color:#ff9500;text-shadow:0 0 10px rgba(255,200,100,0.3)}
.progress-num span{font-size:11px;color:rgba(255,200,100,0.65);font-weight:400}
.progress-bar{width:110px;height:2px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;margin:3px auto 0}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9500,#ffb347,#ffd700);transition:width 0.6s}
.progress-tip{font-size:7px;color:rgba(255,255,255,0.08);margin-top:2px;letter-spacing:2px}
.chip{position:absolute;cursor:pointer;transition:transform 0.2s,filter 0.2s}
.chip.available:hover{transform:scale(1.1);filter:brightness(1.4) drop-shadow(0 0 8px rgba(255,149,0,0.5));z-index:10}
.chip.lit{cursor:default}
.chip.taken{cursor:not-allowed;opacity:0.85}
.chip svg{display:block}
@keyframes chipPop{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.chip.just-lit{animation:chipPop 0.5s ease-out forwards}
@keyframes breathe{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.06) drop-shadow(0 0 4px rgba(255,200,100,0.15))}}
.chip.lit{animation:breathe 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.15) drop-shadow(0 0 6px rgba(255,149,0,0.25))}}
.chip.available{animation:pulse 2.5s ease-in-out infinite}
.particle{position:absolute;pointer-events:none;border-radius:50%;z-index:20}
.celebration{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(10,14,39,0.75);backdrop-filter:blur(4px)}
.celebration.show{display:flex}
.celebration-card{background:linear-gradient(135deg,rgba(20,25,55,0.96),rgba(10,14,39,0.98));border:1px solid rgba(255,149,0,0.2);border-radius:20px;padding:32px 28px;text-align:center;animation:celebPop 0.6s ease-out}
@keyframes swordPop{0%{transform:scale(0) rotate(-45deg);opacity:0}50%{transform:scale(1.3) rotate(10deg);opacity:1}70%{transform:scale(0.9) rotate(-5deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes celebPop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.celebration-card .icon{font-size:48px;margin-bottom:8px}
.celebration-card .title{font-size:20px;color:#ff9500;font-weight:800;margin-bottom:4px}
.celebration-card .desc{font-size:12px;color:rgba(255,179,71,0.5);margin-bottom:16px}
.celebration-card .close-btn{padding:10px 32px;background:linear-gradient(135deg,#ff9500,#ffb347);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,14,39,0.9);backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex}
.modal-card{background:linear-gradient(135deg,rgba(20,25,55,0.96),rgba(10,14,39,0.98));border:1px solid rgba(255,149,0,0.15);border-radius:16px;padding:24px 22px;text-align:center;width:270px;animation:modalIn 0.3s ease-out}
@keyframes modalIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-card .label{font-size:14px;color:rgba(255,179,71,0.75);margin-bottom:12px}
.modal-card input{width:100%;padding:12px;background:rgba(15,20,50,0.85);border:1px solid rgba(255,149,0,0.15);border-radius:10px;color:#ff9500;font-size:15px;text-align:center;outline:none;font-weight:600}
.modal-card input::placeholder{color:rgba(255,255,255,0.2);font-size:13px}
.modal-card input:focus{border-color:rgba(255,149,0,0.35)}
.modal-card .btns{display:flex;gap:10px;margin-top:12px}
.modal-card .btn-cancel{flex:1;padding:10px 0;background:transparent;border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:rgba(255,255,255,0.2);font-size:13px;cursor:pointer}
.modal-card .btn-ok{flex:1;padding:10px 0;background:linear-gradient(135deg,#ff9500,#ffb347);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.modal-card .error{color:#ff5555;font-size:11px;margin-top:6px;display:none}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(20,25,55,0.96);border:1px solid rgba(255,149,0,0.15);border-radius:18px;padding:28px 36px;text-align:center;z-index:200;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);box-shadow:0 0 30px rgba(255,149,0,0.3),0 0 60px rgba(255,149,0,0.12)}
.toast .icon{font-size:48px;margin-bottom:8px;animation:swordPop 0.6s cubic-bezier(0.34,1.56,0.64,1)}
.toast .msg{font-size:16px;color:#ff9500;font-weight:700}
.toast .sub{font-size:11px;color:rgba(255,179,71,0.4);margin-top:4px}
.already-toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(15,20,50,0.92);border:1px solid rgba(255,149,0,0.1);border-radius:12px;padding:14px 22px;text-align:center;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none}
.already-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.already-toast .msg{font-size:12px;color:rgba(255,179,71,0.5)}
.admin-fab{position:fixed;bottom:12px;right:12px;z-index:50;width:26px;height:26px;border-radius:50%;background:rgba(20,25,55,0.5);border:1px solid rgba(255,149,0,0.08);color:rgba(255,179,71,0.25);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.admin-panel{position:fixed;bottom:44px;right:12px;z-index:50;display:none;gap:6px;align-items:center;background:rgba(15,20,50,0.92);border:1px solid rgba(255,149,0,0.08);border-radius:8px;padding:8px 12px;flex-wrap:wrap;max-width:260px}
.admin-panel.show{display:flex}
.admin-panel label{font-size:9px;color:rgba(255,140,105,0.3)}
.admin-panel input{background:rgba(15,20,50,0.85);border:1px solid rgba(255,149,0,0.1);color:#ccc;padding:3px 6px;border-radius:4px;font-size:9px;width:40px;text-align:center}
.admin-panel button{background:rgba(180,100,30,0.3);border:1px solid rgba(255,149,0,0.1);color:rgba(255,179,71,0.4);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:9px}
.admin-panel button.primary{background:linear-gradient(135deg,#ff9500,#ffb347);color:#fff;border:none}
.share-btn{position:absolute;top:12px;right:12px;z-index:999;padding:8px 16px;border-radius:20px;background:rgba(255,200,100,0.15);color:rgba(240,192,64,0.85);font-size:13px;font-weight:600;border:1px solid rgba(255,200,100,0.3);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.share-btn:active{opacity:0.7;transform:scale(0.96)}
</style>

<script>

  // 版本标记
  localStorage.setItem('sc6_ver', 'v20260702.2');

/* 深海背景动画 - 龙虾进阶主题 */
(function(){
  var c=document.getElementById('bgCanvas'),ctx=c.getContext('2d'),w,h;
  var bubbles=[];
  var currents=[];
  
  function resize(){
    w=c.width=innerWidth;
    h=c.height=innerHeight;
    initBubbles();
    initCurrents();
  }
  
  function initBubbles(){
    bubbles=[];
    for(var i=0;i<25;i++){
      bubbles.push({
        x:Math.random()*w,
        y:Math.random()*h,
        size:1+Math.random()*3,
        speedY:-(0.2+Math.random()*0.5),
        speedX:(Math.random()-0.5)*0.2,
        alpha:0.15+Math.random()*0.3,
        life:Math.random(),
        decay:0.001+Math.random()*0.002,
        hue:15+Math.random()*30
      });
    }
  }
  
  function initCurrents(){
    currents=[];
    for(var i=0;i<6;i++){
      currents.push({
        x:Math.random()*w,
        y:h*0.4+Math.random()*h*0.6,
        size:5+Math.random()*10,
        speedY:-(0.05+Math.random()*0.15),
        speedX:(Math.random()-0.5)*0.1,
        alpha:0.05+Math.random()*0.1,
        pulse:Math.random()*Math.PI*2,
        pulseSpeed:0.015+Math.random()*0.02
      });
    }
  }
  
  function drawWave(yPos,amplitude,frequency,color,alpha){
    ctx.beginPath();
    ctx.moveTo(0,yPos);
    for(var x=0;x<=w;x+=5){
      var y=yPos+Math.sin(x*frequency+Date.now()*0.0008)*amplitude;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(w,h);
    ctx.lineTo(0,h);
    ctx.closePath();
    ctx.fillStyle=color.replace('{alpha}',alpha);
    ctx.fill();
  }
  
  function drawBubble(b){
    ctx.save();
    ctx.globalAlpha=b.alpha*b.life;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
    var r=Math.floor(220+b.hue*1.5);
    var g=Math.floor(130+b.hue*1.2);
    var b2=Math.floor(30+b.hue*0.3);
    ctx.fillStyle='rgba('+r+','+g+','+b2+',1)';
    ctx.shadowColor='rgba('+r+','+g+','+b2+',0.6)';
    ctx.shadowBlur=b.size*3;
    ctx.fill();
    ctx.restore();
  }
  
  function drawCurrentGlow(cur){
    ctx.save();
    ctx.translate(cur.x,cur.y);
    var pulseAlpha=cur.alpha*(0.7+0.3*Math.sin(cur.pulse));
    var grad=ctx.createRadialGradient(0,0,0,0,0,cur.size);
    grad.addColorStop(0,'rgba(255,149,0,'+pulseAlpha+')');
    grad.addColorStop(0.4,'rgba(255,179,71,'+pulseAlpha*0.5+')');
    grad.addColorStop(1,'rgba(200,100,30,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,cur.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  
  function updateBubbles(){
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      b.x+=b.speedX;
      b.y+=b.speedY;
      b.life-=b.decay;
      if(b.life<=0||b.y<-10){
        b.x=Math.random()*w;
        b.y=h+10;
        b.life=0.6+Math.random()*0.4;
        b.alpha=0.15+Math.random()*0.3;
      }
    }
  }
  
  function updateCurrents(){
    for(var i=0;i<currents.length;i++){
      var cur=currents[i];
      cur.x+=cur.speedX+Math.sin(cur.pulse)*0.15;
      cur.y+=cur.speedY;
      cur.pulse+=cur.pulseSpeed;
      if(cur.y<-cur.size*2){
        cur.x=Math.random()*w;
        cur.y=h+cur.size;
      }
    }
  }
  
  function draw(){
    var grad=ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#141a38');
    grad.addColorStop(0.3,'#1c2245');
    grad.addColorStop(0.7,'#262c4f');
    grad.addColorStop(1,'#141a38');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);
    
    var waterY=h*0.6;
    drawWave(waterY,5,0.005,'rgba(255,149,0,{alpha})',0.05);
    drawWave(waterY+12,4,0.008,'rgba(255,179,71,{alpha})',0.03);
    drawWave(waterY+24,3,0.011,'rgba(255,200,100,{alpha})',0.02);
    
    updateBubbles();
    for(var i=0;i<bubbles.length;i++){
      drawBubble(bubbles[i]);
    }
    
    updateCurrents();
    for(var i=0;i<currents.length;i++){
      drawCurrentGlow(currents[i]);
    }
    
    requestAnimationFrame(draw);
  }
  
  resize();
  draw();
  addEventListener('resize',resize);
})();

var total=34,myName='',myLitIndex=-1,pendingIdx=-1,litMap={},adminMode=false;

/* ========== 箭头冲锋布局（进阶冲锋） ========== */
var R=Math.max(20,Math.min(34,Math.floor(innerWidth/13)));
var savedCells=[],savedGridR=R,savedOffX=0,savedOffY=0,savedMinX=0,savedMinY=0,savedMaxX=0,savedMaxY=0;
var stepX=R*1.65, stepY=R*1.65;

function heartVal(x,y){return 0}
function findScale(){return 1}
function countInside(s){return total}
function getCells(s){
  var cells=[];
  /* 箭头冲锋形：9行，底部最宽向上收尖再展开，象征进阶冲锋 */
  var rowCounts=[2,4,5,6,5,4,5,6,7];
  var rows=rowCounts.length;
  var startY=-(rows-1)/2*stepY;
  for(var r=0;r<rows;r++){
    var colsInRow=rowCounts[r];
    var startX=-(colsInRow-1)/2*stepX;
    for(var c=0;c<colsInRow;c++){
      if(cells.length>=total)break;
      var px=startX+c*stepX, py=startY+r*stepY;
      cells.push({row:r,col:c,px:px,py:py,v:0});
    }
    if(cells.length>=total)break;
  }
  return cells;
}

/* 进阶·战甲SVG - 龙虾进阶风格 */
function chipSVG(lit,disp,idx){
  var w=Math.round(R*1.8), h=Math.round(R*1.8);
  var cx=w/2, cy=h/2;
  var r=Math.round(R*0.55);
  
  if(lit){
    var nameSize = Math.max(9, R*0.38);
    var nameY = disp ? cy + nameSize*0.3 : cy;
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<radialGradient id="gl'+idx+'" cx="50%" cy="40%" r="60%">'+

/* 昵称显示 */
function cuteName(n){
  if(!n)return'';
  var len=n.length;
  var isEnglish=/^[a-zA-Z0-9~!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+$/.test(n);
  if(isEnglish)return n;
  if(len<=3)return n;
  return n.charAt(len-1)+n.charAt(len-1);
}

/* 粒子爆发 */
function burstParticles(el){
  var rect=el.getBoundingClientRect();
  var ox=rect.left+rect.width/2, oy=rect.top+rect.height/2;
  var colors=['#ff9500','#ffb347','#ffd700','#ff8c00','#ffc107','#ffffff'];
  for(var i=0;i<22;i++){
    var p=document.createElement('div');p.className='particle';
    var angle=Math.PI*2*i/22+Math.random()*0.3, dist=25+Math.random()*40;
    var dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist;
    var size=2+Math.random()*4;
    var isGold=i%4===0;
    p.style.cssText='left:'+ox+'px;top:'+oy+'px;width:'+size+'px;height:'+size+'px;background:'+colors[i%colors.length]+';border-radius:50%;position:fixed;transition:all 0.7s cubic-bezier(0.25,0.46,0.45,0.94);opacity:1;z-index:150;box-shadow:'+(isGold?'0 0 6px #ffd700':'0 0 3px rgba(255,149,0,0.6)')+';';
    document.body.appendChild(p);
    (function(el,dx,dy){requestAnimationFrame(function(){el.style.transform='translate('+dx+'px,'+dy+'px) scale(0.3)';el.style.opacity='0'})})(p,dx,dy);
    (function(el){setTimeout(function(){el.remove()},800)})(p);
  }
}

function buildGrid(){
  total=parseInt(document.getElementById('totalInput').value)||34;
  total=Math.max(1,Math.min(99,total));
  var scale=findScale();
  var cells=getCells(scale);
  if(cells.length>total){cells.sort(function(a,b){return b.v-a.v});cells=cells.slice(cells.length-total)}
  cells.sort(function(a,b){return a.py!==b.py?a.py-b.py:a.px-b.px});
  total=cells.length;
  document.getElementById('totalInput').value=total;
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(var i=0;i<cells.length;i++){
    if(cells[i].px<minX)minX=cells[i].px;if(cells[i].px>maxX)maxX=cells[i].px;
    if(cells[i].py<minY)minY=cells[i].py;if(cells[i].py>maxY)maxY=cells[i].py;
  }
  var offX=-minX+10, offY=-minY+30;
  var gridW=maxX-minX+R*1.9+20, gridH=maxY-minY+R*1.9+20;
  savedCells=cells.slice();savedGridR=R;savedOffX=offX;savedOffY=offY;savedMinX=minX;savedMinY=minY;savedMaxX=maxX;savedMaxY=maxY;
  var grid=document.getElementById('heartGrid');grid.innerHTML='';
  grid.style.width=gridW+'px';grid.style.height=gridH+'px';
  var glow=document.createElement('div');glow.className='heart-glow';grid.appendChild(glow);
  for(var i=0;i<cells.length;i++){
    var isLit=litMap.hasOwnProperty(i), isMine=(myLitIndex===i);
    var el=document.createElement('div');
    var cls='chip';if(isLit)cls+=' lit';else cls+=' available';if(isLit&&!isMine)cls+=' taken';
    el.className=cls;
    el.style.left=(cells[i].px+offX)+'px';el.style.top=(cells[i].py+offY)+'px';
    el.setAttribute('data-index',i);
    el.innerHTML=chipSVG(isLit,isLit?cuteName(litMap[i]):'',i);
    (function(idx){el.onclick=function(){onCellClick(idx)}})(i);
    grid.appendChild(el);
  }
  updateProgress();
}

var armorRainTimer=null,armorRainDrops=[];
function startArmorRain(){
  if(armorRainTimer)return;
  var colors=['#ff9500','#ffb347','#ffd700','#ffc107','#ff8c00'];
  var makeDrop=function(){
    var d=document.createElement('div');
    var size=4+Math.random()*8;

    d.style.cssText='position:fixed;top:-20px;left:'+Math.random()*100+'vw;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+colors[Math.floor(Math.random()*colors.length)]+';box-shadow:'+(isGold?'0 0 10px #ffd700':'0 0 6px rgba(255,149,0,0.7)')+';z-index:9998;pointer-events:none;opacity:'+(0.6+Math.random()*0.4)+';transition:transform 2.5s linear, opacity 2.5s ease-in;';
    document.body.appendChild(d);
    armorRainDrops.push(d);
    var dur=2000+Math.random()*2500;
    var sway=(Math.random()-0.5)*80;
    requestAnimationFrame(function(){
      d.style.transform='translate('+sway+'px,'+(window.innerHeight+40)+'px) rotate(360deg)';
      d.style.opacity='0';
    });
    setTimeout(function(){d.remove();var idx=armorRainDrops.indexOf(d);if(idx>=0)armorRainDrops.splice(idx,1)},dur+100);
  };
  for(var i=0;i<15;i++){setTimeout(makeDrop,i*120)}
  armorRainTimer=setInterval(function(){for(var j=0;j<3;j++){setTimeout(makeDrop,j*100)}},400);
  setTimeout(stopArmorRain,6000);
}
function stopArmorRain(){
  if(armorRainTimer){clearInterval(armorRainTimer);armorRainTimer=null}
}

function _roundRect(ctx,x,y,w,h,r){if(w<2*r)r=w/2;if(h<2*r)r=h/2;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function shareImage(){
  try{

  for(var i=0;i<savedCells.length;i++){

  /* 龙虾骑士 - base64图片绘制 */

}
