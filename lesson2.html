<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>星河打卡 · AI编程训练营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#122840}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(8,22,38,0.4) 100%)}
.scene{position:relative;z-index:2;width:100%;width:100%;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:16px 4px 10px}
.header{text-align:center;flex-shrink:0}
.header h1{font-size:20px;font-weight:800;color:#fff;letter-spacing:4px;text-shadow:0 0 20px rgba(40,200,150,0.3)}
.header .sub{font-size:11px;color:rgba(40,200,150,0.4);margin-top:2px;letter-spacing:4px}
.heart-area{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.heart-grid{position:relative;margin:0 auto}
.heart-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;height:90vw;max-width:400px;max-height:400px;background:radial-gradient(ellipse,rgba(30,140,100,0.08) 0%,transparent 70%);pointer-events:none;z-index:-1}
.robot-section{flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-top:-8px}
.robot-img{width:85px;height:auto;object-fit:contain;filter:drop-shadow(0 0 8px rgba(40,200,150,0.25))}
.robot-label{font-size:8px;color:rgba(40,200,150,0.35);letter-spacing:3px;margin-top:2px}
.bottom-stats{flex-shrink:0;text-align:center;margin-top:6px}
.progress-label{font-size:10px;color:rgba(255,255,255,0.25);margin-bottom:1px}
.progress-num{font-size:26px;font-weight:800;color:#F0C040;text-shadow:0 0 10px rgba(240,192,64,0.3)}
.progress-num span{font-size:12px;color:rgba(240,192,64,0.6);font-weight:400}
.progress-bar{width:130px;height:2px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;margin:4px auto 0}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#2ECC71,#F0C040,#E74C3C);transition:width 0.6s}
.progress-tip{font-size:7px;color:rgba(255,255,255,0.06);margin-top:3px;letter-spacing:2px}
.hex{position:absolute;cursor:pointer;transition:transform 0.2s,filter 0.2s}
.hex.available:hover{transform:scale(1.1);filter:brightness(1.4) drop-shadow(0 0 8px rgba(40,200,150,0.5));z-index:10}
.hex.lit{cursor:default}
.hex.taken{cursor:not-allowed;opacity:0.85}
.hex svg{display:block}
@keyframes hexPop{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.hex.just-lit{animation:hexPop 0.5s ease-out forwards}
@keyframes breathe{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.06) drop-shadow(0 0 4px rgba(240,192,64,0.15))}}
.hex.lit{animation:breathe 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.15) drop-shadow(0 0 6px rgba(40,200,150,0.2))}}
.hex.available{animation:pulse 2.5s ease-in-out infinite}
/* 粒子层 */
.particle{position:absolute;pointer-events:none;border-radius:50%;z-index:20}
/* 庆祝层 */
.celebration{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(8,22,38,0.7);backdrop-filter:blur(4px)}
.celebration.show{display:flex}
.celebration-card{background:linear-gradient(135deg,rgba(10,26,40,0.96),rgba(10,26,40,0.98));border:1px solid rgba(40,200,150,0.2);border-radius:20px;padding:32px 28px;text-align:center;animation:celebPop 0.6s ease-out}
@keyframes celebPop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.celebration-card .icon{font-size:48px;margin-bottom:8px}
.celebration-card .title{font-size:20px;color:#2ECC71;font-weight:800;margin-bottom:4px}
.celebration-card .desc{font-size:12px;color:rgba(40,200,150,0.5);margin-bottom:16px}
.celebration-card .close-btn{padding:10px 32px;background:linear-gradient(135deg,#2ECC71,#1ABC9C);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,20,35,0.88);backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex}
.modal-card{background:linear-gradient(135deg,rgba(10,26,40,0.96),rgba(10,26,40,0.98));border:1px solid rgba(40,200,150,0.12);border-radius:16px;padding:24px 22px;text-align:center;width:270px;animation:modalIn 0.3s ease-out}
@keyframes modalIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-card .label{font-size:14px;color:rgba(40,200,150,0.7);margin-bottom:12px}
.modal-card input{width:100%;padding:12px;background:rgba(10,26,40,0.8);border:1px solid rgba(40,200,150,0.12);border-radius:10px;color:#F0C040;font-size:15px;text-align:center;outline:none;font-weight:600}
.modal-card input::placeholder{color:rgba(255,255,255,0.2);font-size:13px}
.modal-card input:focus{border-color:rgba(40,200,150,0.35)}
.modal-card .btns{display:flex;gap:10px;margin-top:12px}
.modal-card .btn-cancel{flex:1;padding:10px 0;background:transparent;border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:rgba(255,255,255,0.2);font-size:13px;cursor:pointer}
.modal-card .btn-ok{flex:1;padding:10px 0;background:linear-gradient(135deg,#2ECC71,#1ABC9C);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.modal-card .error{color:#ff5555;font-size:11px;margin-top:6px;display:none}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(10,26,40,0.96);border:1px solid rgba(40,200,150,0.15);border-radius:18px;padding:28px 36px;text-align:center;z-index:200;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .icon{font-size:40px;margin-bottom:6px}
.toast .msg{font-size:16px;color:#F0C040;font-weight:700}
.toast .sub{font-size:11px;color:rgba(40,200,150,0.4);margin-top:4px}
.already-toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(10,26,40,0.92);border:1px solid rgba(40,200,150,0.08);border-radius:12px;padding:14px 22px;text-align:center;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none}
.already-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.already-toast .msg{font-size:12px;color:rgba(40,200,150,0.5)}
.admin-fab{position:fixed;bottom:12px;right:12px;z-index:50;width:26px;height:26px;border-radius:50%;background:rgba(10,26,40,0.5);border:1px solid rgba(40,200,150,0.06);color:rgba(40,200,150,0.25);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.admin-panel{position:fixed;bottom:44px;right:12px;z-index:50;display:none;gap:6px;align-items:center;background:rgba(10,26,40,0.92);border:1px solid rgba(40,200,150,0.06);border-radius:8px;padding:8px 12px;flex-wrap:wrap;max-width:260px}
.admin-panel.show{display:flex}
.admin-panel label{font-size:9px;color:rgba(40,200,150,0.3)}
.admin-panel input{background:rgba(10,26,40,0.8);border:1px solid rgba(40,200,150,0.08);color:#ccc;padding:3px 6px;border-radius:4px;font-size:9px;width:40px;text-align:center}
.admin-panel button{background:rgba(30,140,100,0.3);border:1px solid rgba(40,200,150,0.08);color:rgba(40,200,150,0.4);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:9px}
.admin-panel button.primary{background:linear-gradient(135deg,#2ECC71,#1ABC9C);color:#fff;border:none}

.share-btn{position:absolute;top:4px;right:6px;z-index:999;padding:3px 8px;border-radius:10px;background:rgba(240,192,64,0.15);color:rgba(240,192,64,0.7);font-size:10px;font-weight:600;border:1px solid rgba(240,192,64,0.25);cursor:pointer;white-space:nowrap}
.share-btn:active{opacity:0.7}

</style>

<body>
<canvas id="bgCanvas"></canvas>
<div class="vignette"></div>
<div class="modal-overlay" id="nameModal"><div class="modal-card"><div class="label">✦ 输入昵称，点亮你的灯</div><input type="text" id="nameInput" placeholder="你的昵称" maxlength="8"><div class="error" id="nameError"></div><div class="btns"><button class="btn-cancel" onclick="cancelName()">取消</button><button class="btn-ok" onclick="confirmName()">点亮 ✦</button></div></div></div>
<div class="toast" id="successToast"><div class="icon">🐉</div><div class="msg">打卡成功！</div><div class="sub">江面因你更璀璨 ✦</div></div>
<div class="already-toast" id="alreadyToast"><div class="msg">你已经点亮过了哦 🎋</div></div>
<div class="celebration" id="celebration"><div class="celebration-card"><div class="icon">🎆</div><div class="title">灯火辉煌！</div><div class="desc">每一盏灯都在路上，期待满江璀璨的那一天</div><button class="close-btn" onclick="closeCelebration()">继续闪耀 ✦</button></div></div>

<div class="admin-fab" title="管理面板" onclick="tryAdmin()">⚙</div>
<div class="admin-panel" id="adminPanel"><label>数</label><input type="number" id="totalInput" value="33" min="1" max="99"><button class="primary" onclick="adminRandom()">模拟</button><button onclick="adminFull()">满员</button><button onclick="adminReset()">重置</button><br><label>主标题</label><input type="text" id="titleInput" style="width:80px" onchange="saveTitle()"><label>副标题</label><input type="text" id="subtitleInput" style="width:80px" onchange="saveTitle()"><br><label>按灭</label><input type="text" id="unlightName" placeholder="输入昵称" style="width:60px"><button onclick="adminUnlight()">按灭</button><label style="margin-left:4px">字号</label><input type="number" id="titleSizeInput" value="20" min="12" max="36" style="width:32px" onchange="setTitleSize(this.value)"></div>
<div class="scene">
  <button class="share-btn" onclick="shareImage()">📷分享</button>
  <div class="header"><h1 contenteditable="false" id="mainTitle" style="outline:none;min-width:60px;transition:border 0.3s;border-bottom:2px solid transparent">AI编程课</h1><div class="sub" contenteditable="false" id="subTitle" style="outline:none;min-width:60px;transition:border 0.3s;border-bottom:1px solid transparent">第2课 端午打卡</div></div>

<script>
/* 水波纹+漂浮粽叶背景动画 */
(function(){
  var c=document.getElementById('bgCanvas'),ctx=c.getContext('2d'),w,h;
  var leaves=[];
  var lanterns=[];
  
  function resize(){
    w=c.width=innerWidth;
    h=c.height=innerHeight;
    initLeaves();
    initLanterns();
  }
  
  function initLeaves(){
    leaves=[];
    for(var i=0;i<25;i++){
      leaves.push({
        x:Math.random()*w,
        y:Math.random()*h,
        size:8+Math.random()*12,
        speed:0.2+Math.random()*0.4,
        angle:Math.random()*Math.PI*2,
        rotSpeed:(Math.random()-0.5)*0.02,
        alpha:0.15+Math.random()*0.15
      });
    }
  }
  
  function initLanterns(){
    lanterns=[];
    for(var i=0;i<4;i++){
      lanterns.push({
        x:Math.random()*w,
        y:Math.random()*h*0.6,
        size:10+Math.random()*6,
        speed:0.15+Math.random()*0.2,
        wobble:Math.random()*Math.PI*2,
        wobbleSpeed:0.02+Math.random()*0.02,
        alpha:0.2+Math.random()*0.15
      });
    }
  }
  
  function drawWave(yPos,amplitude,frequency,color,alpha){
    ctx.beginPath();
    ctx.moveTo(0,yPos);
    for(var x=0;x<=w;x+=5){
      var y=yPos+Math.sin(x*frequency+Date.now()*0.001)*amplitude;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(w,h);
    ctx.lineTo(0,h);
    ctx.closePath();
    ctx.fillStyle=color.replace('{alpha}',alpha);
    ctx.fill();
  }
  
  function drawLeaf(lf){
    ctx.save();
    ctx.translate(lf.x,lf.y);
    ctx.rotate(lf.angle);
    ctx.beginPath();
    ctx.ellipse(0,0,lf.size,lf.size*0.5,0,0,Math.PI*2);
    ctx.fillStyle='rgba(60,140,60,'+lf.alpha+')';
    ctx.fill();
    ctx.strokeStyle='rgba(80,180,80,'+lf.alpha*0.5+')';
    ctx.lineWidth=0.5;
    ctx.beginPath();
    ctx.moveTo(-lf.size*0.8,0);
    ctx.lineTo(lf.size*0.8,0);
    ctx.stroke();
    ctx.restore();
  }
  
  function drawLantern(ln){
    ctx.save();
    ctx.translate(ln.x,ln.y);
    var wobbleX=Math.sin(ln.wobble)*3;
    ctx.translate(wobbleX,0);
    ctx.beginPath();
    ctx.arc(0,0,ln.size,0,Math.PI*2);
    ctx.fillStyle='rgba(200,60,60,'+ln.alpha+')';
    ctx.fill();
    ctx.strokeStyle='rgba(240,192,64,'+ln.alpha*0.8+')';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,-ln.size);
    ctx.lineTo(0,-ln.size-6);
    ctx.lineTo(3,-ln.size-8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2,-ln.size-6,2,0,Math.PI*2);
    ctx.fillStyle='rgba(240,192,64,'+ln.alpha+')';
    ctx.fill();
    ctx.restore();
  }
  
  function updateLeaves(){
    for(var i=0;i<leaves.length;i++){
      var lf=leaves[i];
      lf.x+=lf.speed;
      lf.angle+=lf.rotSpeed;
      if(lf.x>w+lf.size)lf.x=-lf.size;
      if(lf.angle>Math.PI*2)lf.angle-=Math.PI*2;
    }
  }
  
  function updateLanterns(){
    for(var i=0;i<lanterns.length;i++){
      var ln=lanterns[i];
      ln.x+=ln.speed;
      ln.wobble+=ln.wobbleSpeed;
      if(ln.x>w+ln.size)ln.x=-ln.size;
    }
  }
  
  function draw(){
    var grad=ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#0e2238');
    grad.addColorStop(0.3,'#142d45');
    grad.addColorStop(0.7,'#183550');
    grad.addColorStop(1,'#142840');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);
    
    var waterY=h*0.65;
    drawWave(waterY,8,0.008,'rgba(20,80,100,{alpha})',0.08);
    drawWave(waterY+15,6,0.012,'rgba(25,100,120,{alpha})',0.06);
    drawWave(waterY+30,4,0.015,'rgba(30,120,140,{alpha})',0.04);
    
    updateLeaves();
    for(var i=0;i<leaves.length;i++){
      drawLeaf(leaves[i]);
    }
    
    updateLanterns();
    for(var i=0;i<lanterns.length;i++){
      drawLantern(lanterns[i]);
    }
    
    requestAnimationFrame(draw);
  }
  
  resize();
  draw();
  addEventListener('resize',resize);
})();

var total=33,myName='',myLitIndex=-1,pendingIdx=-1,litMap={},adminMode=false;

/* ========== 粽子形蜂巢计算 ========== */
var R=Math.max(20,Math.min(36,Math.floor(innerWidth/14))),sqrt3=Math.sqrt(3);
var savedCells=[],savedGridR=R,savedOffX=0,savedOffY=0,savedMinX=0,savedMinY=0,savedMaxX=0,savedMaxY=0;
var stepX=sqrt3*R, stepY=1.5*R, halfStep=stepX/2;

function heartVal(x,y){return Math.abs(x)/0.8+Math.abs(y)/1.15-1}
function findScale(){
  var lo=20,hi=300;
  for(var i=0;i<100;i++){var mid=(lo+hi)/2,cnt=countInside(mid);if(cnt<total)lo=mid;else hi=mid}
  return hi;
}
function countInside(s){
  var n=0;
  for(var row=-10;row<=10;row++)for(var col=-10;col<=10;col++){
    var px=col*stepX+(Math.abs(row)%2===1?halfStep:0),py=row*stepY;
    if(heartVal(px/s,-py/s)<=0)n++;
  }
  return n;
}
function getCells(s){
  var cells=[];
  for(var row=-10;row<=10;row++)for(var col=-10;col<=10;col++){
    var px=col*stepX+(Math.abs(row)%2===1?halfStep:0),py=row*stepY;
    var v=heartVal(px/s,-py/s);
    if(v<=0)cells.push({row:row,col:col,px:px,py:py,v:v});
  }
  return cells;
}

/* 端午灯笼六边形SVG - 尖顶 */
function hexSVG(lit,disp,idx){
  var w=Math.round(sqrt3*R), h=2*R;
  var cx=w/2, cy=h/2;
  var pts=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts.push((cx+R*Math.cos(angle)).toFixed(1)+','+(cy+R*Math.sin(angle)).toFixed(1))}
  var ps=pts.join(' ');
  var R1=R*0.82, pts1=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts1.push((cx+R1*Math.cos(angle)).toFixed(1)+','+(cy+R1*Math.sin(angle)).toFixed(1))}
  var ps1=pts1.join(' ');
  var R2=R*0.6, pts2=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts2.push((cx+R2*Math.cos(angle)).toFixed(1)+','+(cy+R2*Math.sin(angle)).toFixed(1))}
  var ps2=pts2.join(' ');
  var R3=R*0.35, pts3=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts3.push((cx+R3*Math.cos(angle)).toFixed(1)+','+(cy+R3*Math.sin(angle)).toFixed(1))}
  var ps3=pts3.join(' ');

  if(lit){
    var nameSize = Math.max(9, R*0.42);
    var nameY = disp ? cy + nameSize*0.35 : cy;
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="gl'+idx+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2ECC71"/><stop offset="50%" stop-color="#27AE60"/><stop offset="100%" stop-color="#1ABC9C"/></linearGradient>'+
        '<radialGradient id="gr'+idx+'" cx="50%" cy="35%" r="50%"><stop offset="0%" stop-color="rgba(46,204,113,0.4)" stop-opacity="0.4"/><stop offset="100%" stop-color="rgba(46,204,113,0)"/></radialGradient>'+
      '</defs>'+
      '<polygon points="'+ps+'" fill="none" stroke="rgba(40,200,150,0.15)" stroke-width="6" style="filter:blur(2px)"/>'+
      '<polygon points="'+ps+'" fill="url(#gl'+idx+')" stroke="rgba(40,200,150,0.3)" stroke-width="1.2"/>'+
      '<polygon points="'+ps1+'" fill="#27AE60" stroke="rgba(40,200,150,0.2)" stroke-width="0.3"/>'+
      '<polygon points="'+ps2+'" fill="#2ECC71" />'+
      '<polygon points="'+ps3+'" fill="#58D68D"/>'+
      '<polygon points="'+ps3+'" fill="url(#gr'+idx+')"/>'+
      '<circle cx="'+cx+'" cy="'+Math.round(cy*0.3)+'" r="'+Math.round(R*0.08)+'" fill="#F0C040" opacity="0.8"/>'+
      (disp?'<text x="'+cx+'" y="'+Math.round(nameY)+'" text-anchor="middle" font-size="'+nameSize.toFixed(1)+'" fill="#fff" font-weight="800" style="text-shadow:0 0 6px rgba(46,204,113,0.8),0 1px 2px rgba(0,0,0,0.5)">'+disp+'</text>':'')+
      '</svg>';
  }else{
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="dl'+idx+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(35,90,120,0.85)"/><stop offset="50%" stop-color="rgba(30,80,110,0.75)"/><stop offset="100%" stop-color="rgba(25,70,100,0.65)"/></linearGradient>'+
        '<radialGradient id="dr'+idx+'" cx="50%" cy="35%" r="50%"><stop offset="0%" stop-color="rgba(40,200,150,0.25)"/><stop offset="100%" stop-color="rgba(40,200,150,0)"/></radialGradient>'+
      '</defs>'+
      '<polygon points="'+ps+'" fill="url(#dl'+idx+')" stroke="rgba(50,200,160,0.55)" stroke-width="1.5"/>'+
      '<polygon points="'+ps1+'" fill="rgba(40,100,130,0.65)" stroke="rgba(50,180,140,0.3)" stroke-width="0.5"/>'+
      '<polygon points="'+ps2+'" fill="rgba(50,120,140,0.55)" />'+
      '<polygon points="'+ps3+'" fill="rgba(55,140,120,0.5)"/>'+
      '<polygon points="'+ps3+'" fill="url(#dr'+idx+')"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+Math.round(R*0.06)+'" fill="rgba(40,200,150,0.5)"/>'+

  }
}

/* 昵称显示：1-3字原样显示，4字及以上取首尾叠字 */
function cuteName(n){
  if(!n)return'';
  var len=n.length;
  if(len<=3)return n;
  return n.charAt(len-2)+n.charAt(len-1);
}

/* 粒子爆发 */
function burstParticles(el){
  var rect=el.getBoundingClientRect();
  var ox=rect.left+rect.width/2, oy=rect.top+rect.height/2;
  var colors=['#2ECC71','#1ABC9C','#F0C040','#58D68D','#ffffff'];
  for(var i=0;i<12;i++){
    var p=document.createElement('div');p.className='particle';
    var angle=Math.PI*2*i/12, dist=30+Math.random()*25;
    var dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist;
    var size=2+Math.random()*3;
    p.style.cssText='left:'+ox+'px;top:'+oy+'px;width:'+size+'px;height:'+size+'px;background:'+colors[i%colors.length]+';position:fixed;transition:all 0.6s cubic-bezier(0.25,0.46,0.45,0.94);opacity:1;';
    document.body.appendChild(p);
    (function(el,dx,dy){requestAnimationFrame(function(){el.style.transform='translate('+dx+'px,'+dy+'px)';el.style.opacity='0'})})(p,dx,dy);
    (function(el){setTimeout(function(){el.remove()},700)})(p);
  }
}

function buildGrid(){
  total=parseInt(document.getElementById('totalInput').value)||33;
  total=Math.max(1,Math.min(99,total));
  var scale=findScale();
  var cells=getCells(scale);
  if(cells.length>total){cells.sort(function(a,b){return b.v-a.v});cells=cells.slice(cells.length-total)}
  cells.sort(function(a,b){return a.py!==b.py?a.py-b.py:a.px-b.px});
  total=cells.length;
  document.getElementById('totalInput').value=total;
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(var i=0;i<cells.length;i++){
    if(cells[i].px<minX)minX=cells[i].px;if(cells[i].px>maxX)maxX=cells[i].px;
    if(cells[i].py<minY)minY=cells[i].py;if(cells[i].py>maxY)maxY=cells[i].py;
  }
  var offX=-minX+10, offY=-minY+10;
  var gridW=maxX-minX+sqrt3*R+20, gridH=maxY-minY+2*R+20;
  savedCells=cells.slice();savedGridR=R;savedOffX=offX;savedOffY=offY;savedMinX=minX;savedMinY=minY;savedMaxX=maxX;savedMaxY=maxY;
  var grid=document.getElementById('heartGrid');grid.innerHTML='';
  grid.style.width=gridW+'px';grid.style.height=gridH+'px';
  var glow=document.createElement('div');glow.className='heart-glow';grid.appendChild(glow);
  for(var i=0;i<cells.length;i++){
    var isLit=litMap.hasOwnProperty(i), isMine=(myLitIndex===i);
    var el=document.createElement('div');
    var cls='hex';if(isLit)cls+=' lit';else cls+=' available';if(isLit&&!isMine)cls+=' taken';
    el.className=cls;
    el.style.left=(cells[i].px+offX)+'px';el.style.top=(cells[i].py+offY)+'px';
    el.setAttribute('data-index',i);
    el.innerHTML=hexSVG(isLit,isLit?cuteName(litMap[i]):'',i);
    (function(idx){el.onclick=function(){onCellClick(idx)}})(i);
    grid.appendChild(el);
  }
  updateProgress();
}

function saveState(){
  localStorage.setItem('sc2_data',JSON.stringify(litMap));
  if(myLitIndex>=0)localStorage.setItem('sc2_myIdx',String(myLitIndex));
  // Sync to server
  try{
    var base=detectApiBase();
    if(base){
      var xhr=new XMLHttpRequest();
      xhr.open('POST',base+'/light',true);
      xhr.setRequestHeader('Content-Type','application/json');
      // Send all cells one by one would be too many requests
      // Instead, send full state via a custom endpoint
      // We'll add a /sync endpoint approach
      syncToServer(base);
    }
  }catch(e){}

function detectApiBase(){
  if(location.hostname.indexOf('trycloudflare')>=0||location.hostname==='localhost'||location.hostname==='127.0.0.1'){
    return '/api/lesson/2';
  }
  return 'https://rear-impression-vault-joel.trycloudflare.com/api/lesson/2';
}
var _serverStateLoaded=false;
function loadState(){
  var s=localStorage.getItem('sc2_data');if(s){try{litMap=JSON.parse(s)}catch(e){litMap={}}}
  var mi=localStorage.getItem('sc2_myIdx');if(mi!==null)myLitIndex=parseInt(mi);
  // Load from server (async, will update display after)
  var base=detectApiBase();
  if(base){
    var xhr=new XMLHttpRequest();
    xhr.open('GET',base+'/state',true);
    xhr.onload=function(){
      if(xhr.status===200){
        try{
          var sv=JSON.parse(xhr.responseText);
          if(sv.cells&&Object.keys(sv.cells).length>0){
            // Server data wins - merge: server cells + any local-only cells
            var merged={};
            for(var k in sv.cells)merged[k]=sv.cells[k];
            for(var k in litMap){if(!merged[k])merged[k]=litMap[k]}
            litMap=merged;
            localStorage.setItem('sc2_data',JSON.stringify(litMap));
            _serverStateLoaded=true;
            buildGrid();
          }
        }catch(e){}
      }
    };
    xhr.onerror=function(){};
    xhr.send();
  }
}
function syncToServer(base){
  var xhr=new XMLHttpRequest();
  xhr.open('POST',base+'/sync',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.send(JSON.stringify({cells:litMap,order:typeof order!=='undefined'?order:[]}));
}

/* ========== 分享图片生成 ========== */
function shareImage(){
  var c=document.createElement('canvas');var W=750,H=1334;c.width=W;c.height=H;var ctx=c.getContext('2d');
  /* 端午背景 */
  var grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0e2238');grad.addColorStop(0.3,'#142d45');grad.addColorStop(0.7,'#183550');grad.addColorStop(1,'#142840');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  /* 水波纹 */
  function drawWaveShare(yPos,amp,freq,color){
    ctx.beginPath();ctx.moveTo(0,yPos);
    for(var x=0;x<=W;x+=5){ctx.lineTo(x,yPos+Math.sin(x*freq+Date.now()*0.001)*amp)}
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=color;ctx.fill();
  }
  var waterY=H*0.65;
  drawWaveShare(waterY,8,0.008,'rgba(20,80,100,0.08)');
  drawWaveShare(waterY+15,6,0.012,'rgba(25,100,120,0.06)');
  /* 星星 */
  for(var i=0;i<280;i++){ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,Math.random()*3+0.5,0,Math.PI*2);ctx.fillStyle='rgba(220,235,255,'+(Math.random()*0.6+0.3)+')';ctx.fill()}
  /* 暗角 */
  var vg=ctx.createRadialGradient(W/2,H/2,200,W/2,H/2,700);vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(10,20,35,0.3)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  /* 标题 */
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='top';ctx.font='bold 52px -apple-system,sans-serif';ctx.fillText(document.getElementById('mainTitle').textContent,W/2,60);
  ctx.font='22px -apple-system,sans-serif';ctx.fillStyle='rgba(40,200,150,0.7)';ctx.fillText(document.getElementById('subTitle').textContent,W/2,125);
  /* 绘制心形格子 - 复用页面buildGrid的布局，保证打卡位置一致 */
  var gridW=savedMaxX-savedMinX+sqrt3*savedGridR+20,gridH=savedMaxY-savedMinY+2*savedGridR+20;
  var bottomStart=H-480;
  var maxGridH=bottomStart-180;
  var sf=Math.min((W-40)/gridW,maxGridH/gridH);
  var cR=savedGridR*sf;
  var marginX=(W-gridW*sf)/2,topY=180;
  /* 心形光晕 */
  var heartCY=topY+gridH*sf/2;
  var hg=ctx.createRadialGradient(W/2,heartCY,30,W/2,heartCY,Math.max(200,gridH*sf*0.5));hg.addColorStop(0,'rgba(30,140,100,0.35)');hg.addColorStop(1,'transparent');ctx.fillStyle=hg;ctx.fillRect(0,150,W,gridH*sf+100);
  for(var i=0;i<savedCells.length;i++){
    var pageCX=savedCells[i].px+savedOffX+sqrt3*savedGridR/2;
    var pageCY=savedCells[i].py+savedOffY+savedGridR;
    var cx2=marginX+pageCX*sf,cy2=topY+pageCY*sf;var isLit=litMap.hasOwnProperty(i);var pts=[];
    for(var j=0;j<6;j++){var angle=Math.PI/180*(60*j-30);pts.push(cx2+cR*Math.cos(angle));pts.push(cy2+cR*Math.sin(angle))}
    ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(var j=1;j<6;j++)ctx.lineTo(pts[j*2],pts[j*2+1]);ctx.closePath();
    if(isLit){
      var g=ctx.createLinearGradient(cx2,cy2-cR,cx2,cy2+cR);g.addColorStop(0,'#2ECC71');g.addColorStop(0.5,'#27AE60');g.addColorStop(1,'#1ABC9C');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(40,200,150,0.3)';ctx.lineWidth=2;ctx.stroke();
