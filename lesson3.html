<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>破局打卡 · AI编程训练营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1210}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(16,8,4,0.4) 100%)}
.scene{position:relative;z-index:2;width:100%;width:100%;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:16px 4px 10px}
.header{text-align:center;flex-shrink:0}
.header h1{font-size:20px;font-weight:800;color:#fff;letter-spacing:4px;text-shadow:0 0 20px rgba(200,160,60,0.3)}
.header .sub{font-size:11px;color:rgba(200,160,60,0.4);margin-top:2px;letter-spacing:4px}
.heart-area{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.heart-grid{position:relative;margin:0 auto}
.heart-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;height:90vw;max-width:400px;max-height:400px;background:radial-gradient(ellipse,rgba(180,120,40,0.08) 0%,transparent 70%);pointer-events:none;z-index:-1}
.robot-section{flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-top:-8px}
.robot-img-wrap{position:relative;width:130px;height:130px;border-radius:50%;overflow:hidden;filter:drop-shadow(0 0 12px rgba(200,160,60,0.35));-webkit-touch-callout:default;-webkit-user-select:none;user-select:none}.robot-img{width:100%;height:100%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}.robot-guard{position:absolute;inset:0;border-radius:50%;z-index:-1;pointer-events:none}
.robot-label{font-size:8px;color:rgba(200,160,60,0.35);letter-spacing:3px;margin-top:2px}
.bottom-stats{flex-shrink:0;text-align:center;margin-top:6px}
.progress-label{font-size:10px;color:rgba(255,255,255,0.25);margin-bottom:1px;margin-top:12px}
.progress-num{font-size:26px;font-weight:800;color:#F0C040;text-shadow:0 0 10px rgba(240,192,64,0.3)}
.progress-num span{font-size:12px;color:rgba(240,192,64,0.6);font-weight:400}
.progress-bar{width:130px;height:2px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;margin:4px auto 0}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#D4A020,#F0C040,#E74C3C);transition:width 0.6s}
.progress-tip{font-size:7px;color:rgba(255,255,255,0.06);margin-top:3px;letter-spacing:2px}
.hex{position:absolute;cursor:pointer;transition:transform 0.2s,filter 0.2s}
.hex.available:hover{transform:scale(1.1);filter:brightness(1.4) drop-shadow(0 0 8px rgba(200,160,60,0.5));z-index:10}
.hex.lit{cursor:default}
.hex.taken{cursor:not-allowed;opacity:0.85}
.hex svg{display:block}
@keyframes hexPop{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.hex.just-lit{animation:hexPop 0.5s ease-out forwards}
@keyframes breathe{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.06) drop-shadow(0 0 4px rgba(240,192,64,0.15))}}
.hex.lit{animation:breathe 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}50%{filter:brightness(1.15) drop-shadow(0 0 6px rgba(200,160,60,0.2))}}
.hex.available{animation:pulse 2.5s ease-in-out infinite}
/* 粒子层 */
.particle{position:absolute;pointer-events:none;border-radius:50%;z-index:20}
/* 庆祝层 */
.celebration{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(16,10,5,0.7);backdrop-filter:blur(4px)}
.celebration.show{display:flex}
.celebration-card{background:linear-gradient(135deg,rgba(30,18,10,0.96),rgba(30,18,10,0.98));border:1px solid rgba(200,160,60,0.2);border-radius:20px;padding:32px 28px;text-align:center;animation:celebPop 0.6s ease-out}
@keyframes swordPop{0%{transform:scale(0) rotate(-45deg);opacity:0}50%{transform:scale(1.3) rotate(10deg);opacity:1}70%{transform:scale(0.9) rotate(-5deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes celebPop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.celebration-card .icon{font-size:48px;margin-bottom:8px}
.celebration-card .title{font-size:20px;color:#D4A020;font-weight:800;margin-bottom:4px}
.celebration-card .desc{font-size:12px;color:rgba(200,160,60,0.5);margin-bottom:16px}
.celebration-card .close-btn{padding:10px 32px;background:linear-gradient(135deg,#D4A020,#E8B830);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(20,12,6,0.88);backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex}
.modal-card{background:linear-gradient(135deg,rgba(30,18,10,0.96),rgba(30,18,10,0.98));border:1px solid rgba(200,160,60,0.12);border-radius:16px;padding:24px 22px;text-align:center;width:270px;animation:modalIn 0.3s ease-out}
@keyframes modalIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-card .label{font-size:14px;color:rgba(200,160,60,0.7);margin-bottom:12px}
.modal-card input{width:100%;padding:12px;background:rgba(30,18,10,0.8);border:1px solid rgba(200,160,60,0.12);border-radius:10px;color:#F0C040;font-size:15px;text-align:center;outline:none;font-weight:600}
.modal-card input::placeholder{color:rgba(255,255,255,0.2);font-size:13px}
.modal-card input:focus{border-color:rgba(200,160,60,0.35)}
.modal-card .btns{display:flex;gap:10px;margin-top:12px}
.modal-card .btn-cancel{flex:1;padding:10px 0;background:transparent;border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:rgba(255,255,255,0.2);font-size:13px;cursor:pointer}
.modal-card .btn-ok{flex:1;padding:10px 0;background:linear-gradient(135deg,#D4A020,#E8B830);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.modal-card .error{color:#ff5555;font-size:11px;margin-top:6px;display:none}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(30,18,10,0.96);border:1px solid rgba(200,160,60,0.15);border-radius:18px;padding:28px 36px;text-align:center;z-index:200;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);box-shadow:0 0 30px rgba(200,160,60,0.3),0 0 60px rgba(200,160,60,0.1)}
.toast .icon{font-size:48px;margin-bottom:8px;animation:swordPop 0.6s cubic-bezier(0.34,1.56,0.64,1)}
.toast .msg{font-size:16px;color:#F0C040;font-weight:700}
.toast .sub{font-size:11px;color:rgba(200,160,60,0.4);margin-top:4px}
.already-toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0.6);background:rgba(30,18,10,0.92);border:1px solid rgba(200,160,60,0.08);border-radius:12px;padding:14px 22px;text-align:center;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none}
.already-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.already-toast .msg{font-size:12px;color:rgba(200,160,60,0.5)}
.admin-fab{position:fixed;bottom:12px;right:12px;z-index:50;width:26px;height:26px;border-radius:50%;background:rgba(30,18,10,0.5);border:1px solid rgba(200,160,60,0.06);color:rgba(200,160,60,0.25);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.admin-panel{position:fixed;bottom:44px;right:12px;z-index:50;display:none;gap:6px;align-items:center;background:rgba(30,18,10,0.92);border:1px solid rgba(200,160,60,0.06);border-radius:8px;padding:8px 12px;flex-wrap:wrap;max-width:260px}
.admin-panel.show{display:flex}
.admin-panel label{font-size:9px;color:rgba(200,160,60,0.3)}
.admin-panel input{background:rgba(30,18,10,0.8);border:1px solid rgba(200,160,60,0.08);color:#ccc;padding:3px 6px;border-radius:4px;font-size:9px;width:40px;text-align:center}
.admin-panel button{background:rgba(160,100,30,0.3);border:1px solid rgba(200,160,60,0.08);color:rgba(200,160,60,0.4);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:9px}
.admin-panel button.primary{background:linear-gradient(135deg,#D4A020,#E8B830);color:#fff;border:none}

.share-btn{position:absolute;top:4px;right:6px;z-index:999;padding:3px 8px;border-radius:10px;background:rgba(240,192,64,0.15);color:rgba(240,192,64,0.7);font-size:10px;font-weight:600;border:1px solid rgba(240,192,64,0.25);cursor:pointer;white-space:nowrap}
.share-btn:active{opacity:0.7}

</style>

<body>
<canvas id="bgCanvas"></canvas>
<div class="vignette"></div>
<div class="modal-overlay" id="nameModal"><div class="modal-card"><div class="label">✦ 输入昵称，点亮你的灯</div><input type="text" id="nameInput" placeholder="你的昵称" maxlength="8"><div class="error" id="nameError"></div><div class="btns"><button class="btn-cancel" onclick="cancelName()">取消</button><button class="btn-ok" onclick="confirmName()">点亮 ✦</button></div></div></div>
<div class="toast" id="successToast"><div class="icon">⚔️</div><div class="msg">打卡成功！</div><div class="sub">剑锋所指，所向披靡 ✦</div></div>
<div class="already-toast" id="alreadyToast"><div class="msg">你已经点亮过了哦 🎋</div></div>
<div class="celebration" id="celebration"><div class="celebration-card"><div class="icon">🎆</div><div class="title">剑指星辰！</div><div class="desc">每一把剑都已出鞘，期待全员破局的那一天</div><button class="close-btn" onclick="closeCelebration()">继续闪耀 ✦</button></div></div>

<div class="admin-fab" title="管理面板" onclick="tryAdmin()">⚙</div>
<div class="admin-panel" id="adminPanel"><label>数</label><input type="number" id="totalInput" value="35" min="1" max="99"><button class="primary" onclick="adminRandom()">模拟</button><button onclick="adminFull()">满员</button><button onclick="adminReset()">重置</button><br><label>主标题</label><input type="text" id="titleInput" style="width:80px" onchange="saveTitle()"><label>副标题</label><input type="text" id="subtitleInput" style="width:80px" onchange="saveTitle()"><br><label>按灭</label><input type="text" id="unlightName" placeholder="输入昵称" style="width:60px"><button onclick="adminUnlight()">按灭</button><label style="margin-left:4px">字号</label><input type="number" id="titleSizeInput" value="20" min="12" max="36" style="width:32px" onchange="setTitleSize(this.value)"></div>

<script>
/* 火花余烬背景动画 - 破局主题 */
(function(){
  var c=document.getElementById('bgCanvas'),ctx=c.getContext('2d'),w,h;
  var sparks=[];
  var embers=[];
  
  function resize(){
    w=c.width=innerWidth;
    h=c.height=innerHeight;
    initSparks();
    initEmbers();
  }
  
  function initSparks(){
    sparks=[];
    for(var i=0;i<30;i++){
      sparks.push({
        x:Math.random()*w,
        y:Math.random()*h,
        size:1+Math.random()*3,
        speedY:-(0.3+Math.random()*0.6),
        speedX:(Math.random()-0.5)*0.3,
        alpha:0.2+Math.random()*0.4,
        life:Math.random(),
        decay:0.002+Math.random()*0.003,
        hue:20+Math.random()*30
      });
    }
  }
  
  function initEmbers(){
    embers=[];
    for(var i=0;i<8;i++){
      embers.push({
        x:Math.random()*w,
        y:h*0.5+Math.random()*h*0.5,
        size:4+Math.random()*8,
        speedY:-(0.1+Math.random()*0.2),
        speedX:(Math.random()-0.5)*0.15,
        alpha:0.1+Math.random()*0.15,
        pulse:Math.random()*Math.PI*2,
        pulseSpeed:0.02+Math.random()*0.03
      });
    }
  }
  
  function drawEmber(yPos,amplitude,frequency,color,alpha){
    ctx.beginPath();
    ctx.moveTo(0,yPos);
    for(var x=0;x<=w;x+=5){
      var y=yPos+Math.sin(x*frequency+Date.now()*0.001)*amplitude;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(w,h);
    ctx.lineTo(0,h);
    ctx.closePath();
    ctx.fillStyle=color.replace('{alpha}',alpha);
    ctx.fill();
  }
  
  function drawSpark(sp){
    ctx.save();
    ctx.globalAlpha=sp.alpha*sp.life;
    ctx.beginPath();
    ctx.arc(sp.x,sp.y,sp.size,0,Math.PI*2);
    var r=200+Math.floor(sp.hue*1.5);
    var g=100+Math.floor(sp.hue);
    var b=Math.floor(sp.hue*0.5);
    ctx.fillStyle='rgba('+r+','+g+','+b+',1)';
    ctx.shadowColor='rgba('+r+','+g+','+b+',0.8)';
    ctx.shadowBlur=sp.size*3;
    ctx.fill();
    ctx.restore();
  }
  
  function drawEmberGlow(em){
    ctx.save();
    ctx.translate(em.x,em.y);
    var pulseAlpha=em.alpha*(0.7+0.3*Math.sin(em.pulse));
    var grad=ctx.createRadialGradient(0,0,0,0,0,em.size);
    grad.addColorStop(0,'rgba(240,160,40,'+pulseAlpha+')');
    grad.addColorStop(0.4,'rgba(200,100,20,'+pulseAlpha*0.6+')');
    grad.addColorStop(1,'rgba(160,60,10,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,em.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  
  function updateSparks(){
    for(var i=0;i<sparks.length;i++){
      var sp=sparks[i];
      sp.x+=sp.speedX;
      sp.y+=sp.speedY;
      sp.life-=sp.decay;
      if(sp.life<=0||sp.y<-10){
        sp.x=Math.random()*w;
        sp.y=h+10;
        sp.life=0.6+Math.random()*0.4;
        sp.alpha=0.2+Math.random()*0.4;
      }
    }
  }
  
  function updateEmbers(){
    for(var i=0;i<embers.length;i++){
      var em=embers[i];
      em.x+=em.speedX+Math.sin(em.pulse)*0.2;
      em.y+=em.speedY;
      em.pulse+=em.pulseSpeed;
      if(em.y<-em.size*2){
        em.x=Math.random()*w;
        em.y=h+em.size;
      }
    }
  }
  
  function draw(){
    var grad=ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#1a0e06');
    grad.addColorStop(0.3,'#2a1508');
    grad.addColorStop(0.7,'#3a1c0a');
    grad.addColorStop(1,'#2a1208');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);
    
    var waterY=h*0.65;
    drawEmber(waterY,8,0.008,'rgba(160,80,20,{alpha})',0.08);
    drawEmber(waterY+15,6,0.012,'rgba(180,100,30,{alpha})',0.06);
    drawEmber(waterY+30,4,0.015,'rgba(200,120,40,{alpha})',0.04);
    
    updateSparks();
    for(var i=0;i<sparks.length;i++){
      drawSpark(sparks[i]);
    }
    
    updateEmbers();
    for(var i=0;i<embers.length;i++){
      drawEmberGlow(embers[i]);
    }
    
    requestAnimationFrame(draw);
  }
  
  resize();
  draw();
  addEventListener('resize',resize);
})();

/* ========== 宝剑形蜂巢计算 ========== */
var R=Math.max(20,Math.min(36,Math.floor(innerWidth/14))),sqrt3=Math.sqrt(3);
var savedCells=[],savedGridR=R,savedOffX=0,savedOffY=0,savedMinX=0,savedMinY=0,savedMaxX=0,savedMaxY=0;
var stepX=sqrt3*R, stepY=1.5*R, halfStep=stepX/2;

function heartVal(x,y){return Math.abs(x)/0.8+Math.abs(y)/1.15-1}
function findScale(){
  var lo=20,hi=300;
  for(var i=0;i<100;i++){var mid=(lo+hi)/2,cnt=countInside(mid);if(cnt<total)lo=mid;else hi=mid}
  return hi;
}
function countInside(s){
  var n=0;
  for(var row=-10;row<=10;row++)for(var col=-10;col<=10;col++){
    var px=col*stepX+(Math.abs(row)%2===1?halfStep:0),py=row*stepY;
    if(heartVal(px/s,-py/s)<=0)n++;
  }
  return n;
}
function getCells(s){
  var cells=[];
  for(var row=-10;row<=10;row++)for(var col=-10;col<=10;col++){
    var px=col*stepX+(Math.abs(row)%2===1?halfStep:0),py=row*stepY;
    var v=heartVal(px/s,-py/s);
    if(v<=0)cells.push({row:row,col:col,px:px,py:py,v:v});
  }
  return cells;
}

/* 破局宝剑六边形SVG - 尖顶 */
function hexSVG(lit,disp,idx){
  var w=Math.round(sqrt3*R), h=2*R;
  var cx=w/2, cy=h/2;
  var pts=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts.push((cx+R*Math.cos(angle)).toFixed(1)+','+(cy+R*Math.sin(angle)).toFixed(1))}
  var ps=pts.join(' ');
  var R1=R*0.82, pts1=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts1.push((cx+R1*Math.cos(angle)).toFixed(1)+','+(cy+R1*Math.sin(angle)).toFixed(1))}
  var ps1=pts1.join(' ');
  var R2=R*0.6, pts2=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts2.push((cx+R2*Math.cos(angle)).toFixed(1)+','+(cy+R2*Math.sin(angle)).toFixed(1))}
  var ps2=pts2.join(' ');
  var R3=R*0.35, pts3=[];
  for(var i=0;i<6;i++){var angle=Math.PI/180*(60*i-30);pts3.push((cx+R3*Math.cos(angle)).toFixed(1)+','+(cy+R3*Math.sin(angle)).toFixed(1))}
  var ps3=pts3.join(' ');

  if(lit){
    var nameSize = Math.max(9, R*0.42);
    var nameY = disp ? cy + nameSize*0.35 : cy;
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="gl'+idx+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D4A020"/><stop offset="50%" stop-color="#C8920A"/><stop offset="100%" stop-color="#E8B830"/></linearGradient>'+
        '<radialGradient id="gr'+idx+'" cx="50%" cy="35%" r="50%"><stop offset="0%" stop-color="rgba(212,160,32,0.4)" stop-opacity="0.4"/><stop offset="100%" stop-color="rgba(212,160,32,0)"/></radialGradient>'+
      '</defs>'+
      '<polygon points="'+ps+'" fill="none" stroke="rgba(200,160,60,0.15)" stroke-width="6" style="filter:blur(2px)"/>'+
      '<polygon points="'+ps+'" fill="url(#gl'+idx+')" stroke="rgba(200,160,60,0.3)" stroke-width="1.2"/>'+
      '<polygon points="'+ps1+'" fill="#C8920A" stroke="rgba(200,160,60,0.2)" stroke-width="0.3"/>'+
      '<polygon points="'+ps2+'" fill="#D4A020" />'+
      '<polygon points="'+ps3+'" fill="#F0D060"/>'+
      '<polygon points="'+ps3+'" fill="url(#gr'+idx+')"/>'+
      '<circle cx="'+cx+'" cy="'+Math.round(cy*0.3)+'" r="'+Math.round(R*0.08)+'" fill="#F0C040" opacity="0.8"/>'+
      (disp?'<text x="'+cx+'" y="'+Math.round(nameY)+'" text-anchor="middle" font-size="'+nameSize.toFixed(1)+'" fill="#fff" font-weight="800" style="text-shadow:0 0 6px rgba(212,160,32,0.8),0 1px 2px rgba(0,0,0,0.5)">'+disp+'</text>':'')+
      '</svg>';
  }else{
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
        '<linearGradient id="dl'+idx+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(80,45,15,0.85)"/><stop offset="50%" stop-color="rgba(70,35,10,0.75)"/><stop offset="100%" stop-color="rgba(60,28,8,0.65)"/></linearGradient>'+
        '<radialGradient id="dr'+idx+'" cx="50%" cy="35%" r="50%"><stop offset="0%" stop-color="rgba(200,160,60,0.25)"/><stop offset="100%" stop-color="rgba(200,160,60,0)"/></radialGradient>'+
      '</defs>'+
      '<polygon points="'+ps+'" fill="url(#dl'+idx+')" stroke="rgba(200,160,60,0.55)" stroke-width="1.5"/>'+
      '<polygon points="'+ps1+'" fill="rgba(90,50,15,0.65)" stroke="rgba(180,140,50,0.3)" stroke-width="0.5"/>'+
      '<polygon points="'+ps2+'" fill="rgba(100,60,20,0.55)" />'+
      '<polygon points="'+ps3+'" fill="rgba(120,70,25,0.5)"/>'+
      '<polygon points="'+ps3+'" fill="url(#dr'+idx+')"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+Math.round(R*0.06)+'" fill="rgba(200,160,60,0.5)"/>'+
      '</svg>';
  }
}

/* 昵称显示：中文3字及以内完整显示，英文完整显示，中文4字及以上末字叠字 */
function cuteName(n){
  if(!n)return'';
  var len=n.length;
  /* 检测是否纯英文（含数字和常见符号） */
  var isEnglish=/^[a-zA-Z0-9~!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+$/.test(n);
  if(isEnglish)return n;
  /* 中文3字及以内完整显示 */
  if(len<=3)return n;
  /* 中文4字及以上：最后一个字叠字 */
  return n.charAt(len-1)+n.charAt(len-1);
}

/* 粒子爆发 */
function burstParticles(el){
  var rect=el.getBoundingClientRect();
  var ox=rect.left+rect.width/2, oy=rect.top+rect.height/2;
  var colors=['#D4A020','#E8B830','#F0C040','#F0D060','#ffffff'];
  for(var i=0;i<12;i++){
    var p=document.createElement('div');p.className='particle';
    var angle=Math.PI*2*i/12, dist=30+Math.random()*25;
    var dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist;
    var size=2+Math.random()*3;
    p.style.cssText='left:'+ox+'px;top:'+oy+'px;width:'+size+'px;height:'+size+'px;background:'+colors[i%colors.length]+';position:fixed;transition:all 0.6s cubic-bezier(0.25,0.46,0.45,0.94);opacity:1;';
    document.body.appendChild(p);
    (function(el,dx,dy){requestAnimationFrame(function(){el.style.transform='translate('+dx+'px,'+dy+'px)';el.style.opacity='0'})})(p,dx,dy);
    (function(el){setTimeout(function(){el.remove()},700)})(p);
  }
}

function buildGrid(){
  total=parseInt(document.getElementById('totalInput').value)||35;
  total=Math.max(1,Math.min(99,total));
  var scale=findScale();
  var cells=getCells(scale);
  if(cells.length>total){cells.sort(function(a,b){return b.v-a.v});cells=cells.slice(cells.length-total)}
  cells.sort(function(a,b){return a.py!==b.py?a.py-b.py:a.px-b.px});
  total=cells.length;
  document.getElementById('totalInput').value=total;
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(var i=0;i<cells.length;i++){
    if(cells[i].px<minX)minX=cells[i].px;if(cells[i].px>maxX)maxX=cells[i].px;
    if(cells[i].py<minY)minY=cells[i].py;if(cells[i].py>maxY)maxY=cells[i].py;
  }
  var offX=-minX+10, offY=-minY+10;
  var gridW=maxX-minX+sqrt3*R+20, gridH=maxY-minY+2*R+20;
  savedCells=cells.slice();savedGridR=R;savedOffX=offX;savedOffY=offY;savedMinX=minX;savedMinY=minY;savedMaxX=maxX;savedMaxY=maxY;
  var grid=document.getElementById('heartGrid');grid.innerHTML='';
  grid.style.width=gridW+'px';grid.style.height=gridH+'px';
  var glow=document.createElement('div');glow.className='heart-glow';grid.appendChild(glow);
  for(var i=0;i<cells.length;i++){
    var isLit=litMap.hasOwnProperty(i), isMine=(myLitIndex===i);
    var el=document.createElement('div');
    var cls='hex';if(isLit)cls+=' lit';else cls+=' available';if(isLit&&!isMine)cls+=' taken';
    el.className=cls;
    el.style.left=(cells[i].px+offX)+'px';el.style.top=(cells[i].py+offY)+'px';
    el.setAttribute('data-index',i);
    el.innerHTML=hexSVG(isLit,isLit?cuteName(litMap[i]):'',i);
    (function(idx){el.onclick=function(){onCellClick(idx)}})(i);
    grid.appendChild(el);
  }
  updateProgress();
}

      history.replaceState(null,'',location.pathname+'?t='+encodeURIComponent(mt2.textContent)+'&st='+encodeURIComponent(st2.textContent));
    });
  }
  bindLongPress(mt,'sc3_title');
  bindLongPress(st,'sc3_subtitle');
})();

/* ========== 分享图片生成 ========== */
function shareImage(){
  var c=document.createElement('canvas');var W=750,H=1334;c.width=W;c.height=H;var ctx=c.getContext('2d');
  /* 破局背景 */
  var grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#1a0e06');grad.addColorStop(0.3,'#2a1508');grad.addColorStop(0.7,'#3a1c0a');grad.addColorStop(1,'#2a1208');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  /* 余烬光效 */
  function drawEmberShare(yPos,amp,freq,color){
    ctx.beginPath();ctx.moveTo(0,yPos);
    for(var x=0;x<=W;x+=5){ctx.lineTo(x,yPos+Math.sin(x*freq+Date.now()*0.001)*amp)}
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=color;ctx.fill();
  }
  var waterY=H*0.65;
  drawEmberShare(waterY,8,0.008,'rgba(160,80,20,0.08)');
  drawEmberShare(waterY+15,6,0.012,'rgba(180,100,30,0.06)');
  /* 星星 */
  for(var i=0;i<280;i++){ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,Math.random()*3+0.5,0,Math.PI*2);ctx.fillStyle='rgba(255,220,180,'+(Math.random()*0.6+0.3)+')';ctx.fill()}
  /* 暗角 */
  var vg=ctx.createRadialGradient(W/2,H/2,200,W/2,H/2,700);vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(15,8,4,0.3)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  /* 标题 */
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='top';ctx.font='bold 52px -apple-system,sans-serif';ctx.fillText(document.getElementById('mainTitle').textContent,W/2,60);
  ctx.font='22px -apple-system,sans-serif';ctx.fillStyle='rgba(200,160,60,0.7)';ctx.fillText(document.getElementById('subTitle').textContent,W/2,125);
  /* 绘制心形格子 - 复用页面buildGrid的布局，保证打卡位置一致 */
  var gridW=savedMaxX-savedMinX+sqrt3*savedGridR+20,gridH=savedMaxY-savedMinY+2*savedGridR+20;
  var bottomStart=H-480;
  var maxGridH=bottomStart-180;
  var sf=Math.min((W-40)/gridW,maxGridH/gridH);
  var cR=savedGridR*sf;
  var marginX=(W-gridW*sf)/2,topY=180;
  /* 心形光晕 */
  var heartCY=topY+gridH*sf/2;
  var hg=ctx.createRadialGradient(W/2,heartCY,30,W/2,heartCY,Math.max(200,gridH*sf*0.5));hg.addColorStop(0,'rgba(180,120,40,0.35)');hg.addColorStop(1,'transparent');ctx.fillStyle=hg;ctx.fillRect(0,150,W,gridH*sf+100);
  for(var i=0;i<savedCells.length;i++){
    var pageCX=savedCells[i].px+savedOffX+sqrt3*savedGridR/2;
    var pageCY=savedCells[i].py+savedOffY+savedGridR;
    var cx2=marginX+pageCX*sf,cy2=topY+pageCY*sf;var isLit=litMap.hasOwnProperty(i);var pts=[];
    for(var j=0;j<6;j++){var angle=Math.PI/180*(60*j-30);pts.push(cx2+cR*Math.cos(angle));pts.push(cy2+cR*Math.sin(angle))}
    ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(var j=1;j<6;j++)ctx.lineTo(pts[j*2],pts[j*2+1]);ctx.closePath();
    if(isLit){
      var g=ctx.createLinearGradient(cx2,cy2-cR,cx2,cy2+cR);g.addColorStop(0,'#D4A020');g.addColorStop(0.5,'#C8920A');g.addColorStop(1,'#E8B830');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(200,160,60,0.3)';ctx.lineWidth=2;ctx.stroke();
      var nm=cuteName(litMap[i]);if(nm){ctx.fillStyle='#fff';ctx.font='bold '+Math.max(11,cR*0.4).toFixed(0)+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nm,cx2,cy2)}
    }else{
      var g=ctx.createLinearGradient(cx2,cy2-cR,cx2,cy2+cR);g.addColorStop(0,'rgba(80,45,15,0.85)');g.addColorStop(0.5,'rgba(70,35,10,0.75)');g.addColorStop(1,'rgba(60,28,8,0.65)');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(200,160,60,0.55)';ctx.lineWidth=2;ctx.stroke()
    }
  }
  /* 机器人 */
  var rH=80;
  var robotImg=document.getElementById('robotImg');if(robotImg&&robotImg.complete&&robotImg.naturalWidth>0){var rW=120,rH2=120*robotImg.naturalHeight/robotImg.naturalWidth,rX=W/2-rW/2,rY=bottomStart-10;ctx.save();ctx.beginPath();ctx.arc(W/2,rY+rH2/2,Math.min(rW,rH2)/2,0,Math.PI*2);ctx.closePath();ctx.clip();ctx.drawImage(robotImg,rX,rY,rW,rH2);ctx.restore();rH=rH2}
  ctx.fillStyle='rgba(200,160,60,0.35)';ctx.font='14px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('宝剑守护者',W/2,bottomStart+rH+8);
  /* 进度 */
  var n=0;for(var k in litMap)if(litMap.hasOwnProperty(k))n++;
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='16px -apple-system,sans-serif';ctx.fillText('已点亮',W/2,bottomStart+rH+28);
  ctx.fillStyle='#F0C040';ctx.font='bold 40px -apple-system,sans-serif';ctx.fillText(n+' / '+total,W/2,bottomStart+rH+62);
  /* 进度条 */
  var barW=260,barH=8,barX=(W-barW)/2,barY=bottomStart+rH+114;ctx.fillStyle='rgba(255,255,255,0.05)';ctx.beginPath();ctx.roundRect(barX,barY,barW,barH,3);ctx.fill();
  var pct=n/total;if(pct>0){var pg=ctx.createLinearGradient(barX,0,barX+barW*pct,0);pg.addColorStop(0,'#D4A020');pg.addColorStop(0.5,'#F0C040');pg.addColorStop(1,'#E74C3C');ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(barX,barY,barW*pct,barH,3);ctx.fill()}
  /* 二维码 */
  try{
    var pageUrl='https://rear-impression-vault-joel.trycloudflare.com/lesson3.html';
    var qr=qrcode(0,'M');qr.addData(pageUrl);qr.make();var mc=qr.getModuleCount();var qs=3,qm=6,qx=W/2-(mc*qs+qm*2)/2,qy=H-60-(mc*qs+qm*2);
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.beginPath();ctx.roundRect(qx-4,qy-4,(mc*qs+qm*2)+8,(mc*qs+qm*2)+8,6);ctx.fill();
    for(var r=0;r<mc;r++)for(var c3=0;c3<mc;c3++){ctx.fillStyle=qr.isDark(r,c3)?'#1a0e06':'#fff';ctx.fillRect(qx+qm+c3*qs,qy+qm+r*qs,qs,qs)}
    ctx.fillStyle='rgba(240,192,64,0.45)';ctx.font='14px -apple-system,sans-serif';ctx.fillText('长按识别二维码 · 加入打卡',W/2,qy-20);
  }catch(e){console.log('qr error',e)}
  var dataUrl=c.toDataURL('image/png');var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center';var img=document.createElement('img');img.src=dataUrl;img.style.cssText='max-width:90%;max-height:75vh;border-radius:8px';var tip=document.createElement('div');tip.style.cssText='color:#fff;font-size:16px;margin-top:16px;opacity:0.7';tip.textContent='\u957f\u6309\u56fe\u7247\u4fdd\u5b58 \u2192 \u53d1\u5230\u7fa4\u804a';var btn=document.createElement('button');btn.style.cssText='margin-top:12px;padding:10px 30px;border:none;border-radius:20px;background:linear-gradient(135deg,#F0C040,#D4A020);color:#000;font-size:16px;font-weight:bold';btn.textContent='\u5173\u95ed';btn.onclick=function(){ov.remove()};ov.appendChild(img);ov.appendChild(tip);ov.appendChild(btn);ov.onclick=function(e){if(e.target===ov)ov.remove()};document.body.appendChild(ov);
}

loadState();buildGrid();
